          '<div class="credit-card' + (s.key === 'approved' ? ' approved' : (s.key === 'denied' ? ' denied' : '')) + '">' +
            '<div class="field-label">Credit Limit</div>' +
            '<div class="field-val lg">' + (hasLimit ? esc(fmtMoney(limit)) : '<span class="empty">—</span>') + '</div>' +
          '</div>' +
          '<div class="credit-card">' +
            '<div class="field-label">Decision</div>' +
            '<div class="field-val lg">' + esc(s.label) + '</div>' +
          '</div>' +
        '</div>' +
        (parseDate(r.Credit_Decision_Date)
          ? '<div style="margin-top: 14px;">' + field('Decision Date', fmtDateTime(parseDate(r.Credit_Decision_Date))) + '</div>'
          : '') +
        (r.Credit_Notes
          ? '<div style="margin-top: 14px;"><div class="field-label" style="margin-bottom: 6px;">Credit Notes</div>' +
            '<div class="note-block">' + esc(r.Credit_Notes) + '</div></div>'
          : '') +
      '</div>' +

      // CREDITAPP1 — Credit Application tracker (Task 16). Hidden until
      // fetchCreditAppStatus fills it; stays hidden (renders as nothing, not
      // broken) when the endpoint 404s (flag off) or answers anything but 200 --
      // including an application that predates this build, which has no
      // /credit-app/status document at all.
      '<div class="panel-section" id="ca-app-section" style="display:none;">' +
        '<div class="panel-section-title">Credit Application<span class="ca-app-summary" id="ca-app-summary-text"></span></div>' +
        '<div class="ca-app-rows" id="ca-app-rows"></div>' +
        '<div class="ca-app-nudgeall-row" id="ca-app-nudgeall-row" style="display:none;">' +
          '<button type="button" class="btn" id="ca-app-nudge-all"></button>' +
        '</div>' +
      '</div>' +

      // CREDITAPP1 — Application Details, every broker. GET /credit-app/application
      // returns only what is operationally the client's own (see
      // fetchCreditAppApplication's comment); hidden until that fills it, stays
      // hidden on a 404 (flag off) or an application that predates this build,
      // same discipline as the tracker section above.
      '<div class="panel-section" id="ca-app-detail-section" style="display:none;">' +
        '<div class="panel-section-title">Application Details</div>' +
        '<div id="ca-app-detail-body"></div>' +
      '</div>' +

      // CREDITAPP1 — full submission, OperFi staff only (empty string for a
      // non-staff viewer -- see caAppStaffSectionHtml above).
      caAppStaffSectionHtml +

      // Customer Company
      '<div class="panel-section">' +
        '<div class="panel-section-title">Customer Company</div>' +
        '<div class="field-grid">' +
          field('Company Name', r.Customer_Company_Name) +
          field('Phone', formatPhone(r.Phone_Number)) +
          fieldLink('Website', r.Company_Website) +
          fieldLink('LinkedIn', r.LinkedIn_Profile) +
        '</div>' +
        (formatAddress(r) ? '<div style="margin-top: 14px;">' + addressFieldHtml(formatAddress(r)) + '</div>' : '') +
        (r.Other_Social_Media_Links ? '<div style="margin-top: 14px;">' + fieldLink('Other Social Media', r.Other_Social_Media_Links) + '</div>' : '') +
      '</div>' +

      // Customer Contacts (+ editable billing info before funding)
      '<div class="panel-section">' +
        '<div class="panel-section-title ca-contacts-head">' +
          '<span>Customer Contacts</span>' +
          '<button class="ca-edit-billing-btn" id="ca-edit-billing">Edit Billing Info</button>' +
        '</div>' +
        // BPOC1: renders only for an approved customer with billing still missing.
        // Its Add Billing Info button opens the CA1 editor below.
        billingAlertHtml(r) +
        '<div class="field-grid">' +
          // Pair customer (left) and billing (right) so they line up row-by-row:
          // POC | Billing POC, Phone | Billing Phone, Email | Billing Email.
          field('Point of Contact', r.Customer_Point_of_Contact) +
          field('Billing POC', r.Billing_Point_of_Contact || '—') +
          field('Phone', formatPhone(r.Phone_Number1)) +
          field('Billing Phone', r.Billing_AP_Contact_Number ? formatPhone(r.Billing_AP_Contact_Number) : '—') +
          field('Email', r.Email) +
          field('Billing Email', r.Billing_Email || '—') +
        '</div>' +
        '<div id="ca-billing-edit" style="display:none;margin-top:14px;">' +
          '<div class="dec-field"><label class="dec-label" for="ca-bill-poc">Billing Point of Contact</label>' +
            '<input class="dec-input" id="ca-bill-poc" type="text"></div>' +
          '<div class="dec-field"><label class="dec-label" for="ca-bill-phone">Billing Phone</label>' +
            '<input class="dec-input" id="ca-bill-phone" type="text"></div>' +
          '<div class="dec-field"><label class="dec-label" for="ca-bill-email">Billing Email</label>' +
            '<input class="dec-input" id="ca-bill-email" type="email"></div>' +
          '<div class="dec-row"><div class="dec-msg" id="ca-bill-msg"></div>' +
            '<button class="btn" id="ca-bill-cancel">Cancel</button>' +
            '<button class="btn primary" id="ca-bill-save">Save Billing Info</button></div>' +
        '</div>' +
      '</div>' +

      // Broker Comments
      (r.Comments
        ? '<div class="panel-section">' +
            '<div class="panel-section-title">Broker Comments</div>' +
            '<div class="note-block">' + esc(r.Comments) + '</div>' +
          '</div>'
        : '') +

      // Supporting Documents
      '<div class="panel-section">' +
        '<div class="panel-section-title">Supporting Documents</div>' +
        docsListHtml(collectFiles(r.Additional_Supporting_Documents), r.ID) +
      '</div>' +

    '</div>' +

    '<div class="panel-footer">' +
      '<div class="kbd-hints"><span class="kbd">↑↓</span> Navigate <span class="kbd">Esc</span> Close</div>' +
      '<div class="actions">' + footerActionsHtml + '</div>' +
    '</div>';

  var panel = document.getElementById('panel');
  panel.innerHTML = html;
  // CREDITAPP2 Task 7 -- read fresh at click time by the delegated staff
  // recovery handler below (wireCreditAppRecovery), the same way
  // wireDocOpen's buttons carry their own data-recid rather than closing
  // over `r`: the panel node is reused across j/k navigation, so a value
  // captured in a closure at wire time would go stale the moment the broker
  // moves to a different record.
  panel.dataset.submissionId = r.ID != null ? String(r.ID) : '';

  var prev = document.getElementById('p-prev');
  var next = document.getElementById('p-next');
  if (!prev.classList.contains('disabled')) prev.addEventListener('click', function() { navPanel(-1); });
  if (!next.classList.contains('disabled')) next.addEventListener('click', function() { navPanel(1); });
  document.getElementById('p-close').addEventListener('click', closePanel);
  var b = document.getElementById('p-boost');
  if (b) b.addEventListener('click', function() { openCreditBoost(r.ID || ''); });
  var rs = document.getElementById('p-resubmit');
  if (rs) rs.addEventListener('click', function() { navigateParent('#Page:Credit_Check'); });

  wireDecisionSection(r);
  fetchFraudCheck(r);
  fetchCreditAppStatus(r);
  fetchCreditAppApplication(r);
  fetchCreditAppRisk(r);
  renderCustomerEventsSection(r);
  wireBillingEdit(r);
  wireDocOpen(panel);   // delegated: open Supporting Documents in the shared viewer
  wireCreditAppRecovery(panel);   // delegated: staff Correct address / Waive
}

// CA1 — let the client add/edit a customer's billing contact info before funding.
// Inline edit on the Customer Contacts section; saves via the account-scoped backend.
function wireBillingEdit(r) {
  var btn = document.getElementById('ca-edit-billing');
  if (!btn) return;
  var form = document.getElementById('ca-billing-edit');
  var openEditor = function() {
    document.getElementById('ca-bill-poc').value = r.Billing_Point_of_Contact || '';
    document.getElementById('ca-bill-phone').value = r.Billing_AP_Contact_Number || '';
    document.getElementById('ca-bill-email').value = r.Billing_Email || '';
    form.style.display = ''; btn.style.display = 'none';
    document.getElementById('ca-bill-poc').focus();
  };
  btn.addEventListener('click', openEditor);
  // BPOC1: the amber callout's Add Billing Info opens the same editor, so the broker
  // never has to hunt for the small Edit Billing Info button in the section header.
  var alertFix = document.getElementById('ca-billing-alert-fix');
  if (alertFix) alertFix.addEventListener('click', openEditor);
  document.getElementById('ca-bill-cancel').addEventListener('click', function() {
    form.style.display = 'none'; btn.style.display = '';
  });
  document.getElementById('ca-bill-save').addEventListener('click', function() {
    var save = document.getElementById('ca-bill-save');
    var msg = document.getElementById('ca-bill-msg');
    var payload = {
      email: (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail,
      submission_id: String(r.ID),
      billing_contact: document.getElementById('ca-bill-poc').value.trim(),
      billing_phone: document.getElementById('ca-bill-phone').value.trim(),
      billing_email: document.getElementById('ca-bill-email').value.trim()
    };
    save.disabled = true; msg.textContent = 'Saving…'; msg.className = 'dec-msg';
    fetch(BROKER_API_BASE + '/broker-edit-customer-billing', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    }).then(function(res) {
      return res.text().then(function(t) { var d = {}; try { d = t ? JSON.parse(t) : {}; } catch (e) {} return { status: res.status, data: d }; });
    }).then(function(rr) {
      if (rr.status === 200 && rr.data.ok) {
        r.Billing_Point_of_Contact = payload.billing_contact;
        r.Billing_AP_Contact_Number = payload.billing_phone;
        r.Billing_Email = payload.billing_email;
        msg.textContent = '✓ Saved'; msg.className = 'dec-msg success';
        setTimeout(function() {
          renderPanel();
          // BPOC1: `r` is the same object the list holds, so re-rendering the rows drops
          // the billing warning from the row behind the panel. Without this the broker
          // fixes the billing contact, closes the panel, and the warning is still sitting
          // there -- reading as if the save did not take.
          renderList();
        }, 600);   // re-render with new values
      } else {
        var detail = rr.data.error || rr.data.message;
        msg.textContent = 'Could not save' + (detail ? ': ' + detail : '') + '.';
        msg.className = 'dec-msg error'; save.disabled = false;
      }
    }).catch(function() {
      msg.textContent = 'Could not save. Check your connection and try again.';
      msg.className = 'dec-msg error'; save.disabled = false;
    });
  });
}

// CC2 — pull domain/fraud signals for the credit team (gated server-side; a 403
// for non-credit users simply leaves the section hidden). On-view only, so the
// client who submitted the customer never sees we ran this.
function fetchFraudCheck(r) {
  if (!allClients) return;
  if (!document.getElementById('ca-fraud')) return;
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  var qs = 'email=' + encodeURIComponent(email) +
           '&customer_email=' + encodeURIComponent(r.Email || '') +
           '&website=' + encodeURIComponent(urlVal(r.Company_Website));
  fetch(BROKER_API_BASE + '/customer-fraud-check?' + qs)
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(d){ if (d) renderFraudCheck(d); })
    .catch(function(){});
}

function renderFraudCheck(d) {
  var sec = document.getElementById('ca-fraud');
  var badge = document.getElementById('ca-fraud-badge');
  var body = document.getElementById('ca-fraud-body');
  if (!sec || !body) return;
  var risk = d.risk || 'unknown';
  var labelMap = { high: 'High risk', medium: 'Review', low: 'Looks clean', unknown: 'Unknown' };
  if (badge) { badge.textContent = labelMap[risk] || risk; badge.className = 'ca-fraud-badge ' + risk; }
  var out = '';
  if (d.reasons && d.reasons.length) {
    out += '<ul class="ca-fraud-reasons">' +
      d.reasons.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  } else if (risk === 'unknown') {
    out += '<div class="ca-fraud-clean">Domain data unavailable.</div>';
  } else {
    out += '<div class="ca-fraud-clean">No domain-age or mismatch flags.</div>';
  }
  var meta = [];
  if (d.email_domain) meta.push('Email domain: ' + esc(d.email_domain));
  if (d.website_domain) meta.push('Website: ' + esc(d.website_domain));
  if (d.domain_age_human) meta.push('Domain age: ' + esc(d.domain_age_human));
  if (meta.length) out += '<div class="ca-fraud-meta">' + meta.join(' · ') + '</div>';
  body.innerHTML = out;
  sec.style.display = '';
}

// ── CREDITAPP1 — Credit Application tracker (Task 16) ───────────────────────
// Who we're waiting on, by name, and how long -- the whole point of this build
// is that the broker can see this without calling OperFi. NEVER renders a fraud
// signal or a reason: /credit-app/status does not send them (that split lives on
// the server, see credit_app_routes.py's module docstring), and nothing here may
// invent a way to display what the endpoint withholds.
var CA_APP_SLOT_LABELS = {
  customer: 'Customer application',
  trade1: 'Trade reference 1',
  trade2: 'Trade reference 2',
  trade3: 'Trade reference 3',
  bank: 'Bank reference'
};
var CA_APP_SLOT_ORDER = ['customer', 'trade1', 'trade2', 'trade3', 'bank'];

// Mirrors credit_app_store.NEEDS_NO_NUDGE (completed, waived, bounced) -- a
// party in one of these needs no Nudge button, because sending again is
// pointless: a bounced address is exactly as dead on the second try.
// Duplicated here rather than fetched from the server, the same tradeoff
// credit_app_routes.py itself makes for TMS_BASE / CREDIT_DECISION_RECEIVED:
// importing across the widget/backend boundary isn't possible, so the
// constant is copied with a comment pointing at its source.
var CA_APP_NEEDS_NO_NUDGE = ['completed', 'waived', 'bounced'];

// Mirrors credit_app_store.COUNTS_AS_ANSWERED (completed, waived) -- a party
// in one of these has actually answered. Deliberately NOT the same set as
// CA_APP_NEEDS_NO_NUDGE above: a bounced party needs no Nudge (the address is
// dead), but nobody answered either, and derive_status agrees on the server --
// a bounce alone never gets an application to ready_for_review. CREDITAPP2
// fix: this widget used to reuse one constant for both meanings, which read a
// bounced party as "answered" the moment a send failed. This also stands in
// for credit_app_store.CANNOT_BE_ANSWERED, which carries the same two values
// today: it gates whether the staff Correct address / Waive controls render
// for a party whose answer is already final.
var CA_APP_ANSWERED = ['completed', 'waived'];

// Mirrors credit_app_store.NUDGE_COOLDOWN_HOURS. Used only to turn the server's
// own "nudged Xh ago" text into a client-side re-enable timer -- if that wording
// ever changes shape the regex in caAppHandleNudgeResult simply fails to match
// and the button just stays disabled with the server's message shown, which is
// still correct, only less convenient.
var CA_APP_NUDGE_COOLDOWN_HOURS = 48;
var CA_APP_NUDGE_LIMIT_MSG = 'nudge limit reached';

function caAppSlotLabel(slot) { return CA_APP_SLOT_LABELS[slot] || slot; }

// status -> { label, cls } in plain words. No numeric/coded state ever reaches
// the broker -- an unrecognised value still renders (falls back to the raw
// string) rather than breaking the row, same discipline as statusMeta's
// 'unknown' branch above for Credit_Decision.
//
// 'sent' and 'opened' used to collapse onto the same "Waiting" label -- the
// backend now sets 'opened' the first time a party actually follows their
// emailed link (credit_app_store.mark_opened_if_sent), so the two are split
// here on purpose: "never opened" (check the address, resend) and "opened,
// still no answer" (the address is fine, go call them) call for opposite
// broker actions, and one label telling both cannot tell either.
// 'opened' gets its own cls (ca-app-state-opened) so it's a distinct DOM
// hook, but that class is styled identically to 'waiting' -- same calm
// amber, no new pill colour -- because this is still ordinary, expected
// waiting, not an alarm. See caAppRowHtml below for why the day count next
// to "Opened" still reads "waiting Xd", not "opened Xd ago": the API only
// ever sends waiting_days, measured from sent_at, never a separate
// opened-to-now figure, so the word next to the number has to be the one
// the number actually measures.
function caAppPartyState(status) {
  if (status === 'completed') return { label: 'Completed', cls: 'completed' };
  if (status === 'waived')    return { label: 'Not required', cls: 'not-required' };
  if (status === 'bounced')   return { label: 'Address bounced', cls: 'bounced' };
  if (status === 'expired')   return { label: 'Expired', cls: 'expired' };
  if (status === 'opened')    return { label: 'Opened', cls: 'opened' };
  if (status === 'sent')      return { label: 'Waiting', cls: 'waiting' };
  return { label: status || 'Unknown', cls: 'waiting' };
}

function caAppWaitingText(days) {
  if (days === null || days === undefined) return '';
  if (days <= 0) return 'less than a day';
  return days + (days === 1 ? ' day' : ' days');
}

// The one-line summary next to the section title. Built from the application's
// top-level `status` (derived server-side from every party -- credit_app_store.
// derive_status), never re-derived here from the party list, so this can never
// disagree with what the rows below it show.
var CA_APP_SUMMARY = {
  sent: 'Waiting on the customer to complete the application',
  app_received: 'Application received — references not sent yet',
  references_pending: 'Waiting on references',
  ready_for_review: 'All parties have responded'
};

if (typeof window !== 'undefined') {
  window.caAppSlotLabel = caAppSlotLabel;
  window.caAppPartyState = caAppPartyState;
  window.caAppWaitingText = caAppWaitingText;
}

function caAppRowHtml(p) {
  var st = caAppPartyState(p.status);
  var nameCompany = [p.company, p.name].filter(Boolean).join(', ');
  var detail;
  var stalled = false;
  if (st.cls === 'bounced') {
    // CREDITAPP2: correction is credit-only (see credit_app_correct_address's
    // docstring -- a complicit broker redirecting their own customer's bank
    // reference to an accomplice is exactly the attack that boundary guards
    // against), so this must never ask the broker to fix an address the
    // product will not let them touch. It routes to credit instead.
    detail = 'Address bounced, ask credit to fix it';
  } else if (st.cls === 'opened') {
    // waiting_days is measured from sent_at, not opened_at (the API sends
    // only one clock -- see caAppPartyState above) -- so the number here
    // still has to be introduced by "waiting", never "opened ... ago", or
    // the label would claim a timestamp the data doesn't have.
    var openedWaiting = caAppWaitingText(p.waiting_days);
    detail = st.label + (openedWaiting ? ', waiting ' + openedWaiting : '');
  } else if (st.cls === 'waiting' || st.cls === 'expired') {
    var waiting = caAppWaitingText(p.waiting_days);
    detail = st.label + (waiting ? ' ' + waiting : '');
    // CREDITAPP2 (Task 3): stalled overlays the waiting state -- the party's
    // status is still 'sent', never a status of its own (see caAppPartyState).
    // The payload carries only waiting_days from sent_at, no opened-to-now
    // clock, so the copy names the fact the server actually derived (never
    // opened) rather than inventing a second number.
    if (st.cls === 'waiting' && p.stalled) { detail += ', never opened'; stalled = true; }
  } else {
    detail = st.label;
  }
  var canNudge = CA_APP_NEEDS_NO_NUDGE.indexOf(p.status) === -1;
  var nudgeHtml = canNudge
    ? '<button type="button" class="row-action ca-app-nudge" data-slot="' + esc(p.slot) + '">Nudge</button>'
    : '';
  // CREDITAPP2 Task 7 -- report a problem. Available to any viewer who sees
  // the tracker, same as Nudge, on every reference slot: the server refuses
  // slot="customer" (no correction/waive path answers a report against the
  // applicant's own party), so this never offers a control that would 400.
  // Takes a note, never an address -- see credit_app_report_problem's own
  // docstring for the attack that boundary guards against.
  var reportBtnHtml = (p.slot === 'customer') ? '' :
    '<button type="button" class="row-action ca-app-report-problem" data-slot="' + esc(p.slot) + '">Report a problem</button>';
  var reportFormHtml = (p.slot === 'customer') ? '' :
    '<div class="ca-app-report-form" data-slot="' + esc(p.slot) + '" style="display:none;">' +
      '<textarea class="ca-app-report-note" placeholder="What looks wrong with this reference?"></textarea>' +
      '<div class="ca-app-report-btns">' +
        '<button type="button" class="row-action primary ca-app-report-send" data-slot="' + esc(p.slot) + '">Send</button>' +
        '<button type="button" class="row-action ca-app-report-cancel" data-slot="' + esc(p.slot) + '">Cancel</button>' +
      '</div>' +
    '</div>';
  var msgHtml = (nudgeHtml || reportBtnHtml)
    ? '<div class="ca-app-msg" data-slot-msg="' + esc(p.slot) + '"></div>' : '';
  var stateCls = 'ca-app-row-state ca-app-state-' + st.cls + (stalled ? ' ca-app-state-stalled' : '');
  return '' +
    '<div class="ca-app-row" data-slot="' + esc(p.slot) + '">' +
      '<div>' +
        '<div class="ca-app-row-label">' + esc(caAppSlotLabel(p.slot)) + '</div>' +
        (nameCompany ? '<div class="ca-app-row-who">' + esc(nameCompany) + '</div>' : '') +
      '</div>' +
      '<div class="' + stateCls + '">' + esc(detail) + '</div>' +
      '<div class="ca-app-row-action">' + nudgeHtml + reportBtnHtml + msgHtml + reportFormHtml + '</div>' +
    '</div>';
}
if (typeof window !== 'undefined') { window.caAppRowHtml = caAppRowHtml; }

// Reorders into the fixed customer/trade1/trade2/trade3/bank sequence
// regardless of the order the server happens to return the parties array in.
function caAppOrderedParties(parties) {
  var bySlot = {};
  (parties || []).forEach(function(p) { if (p && p.slot) bySlot[p.slot] = p; });
  return CA_APP_SLOT_ORDER.map(function(slot) { return bySlot[slot]; }).filter(Boolean);
}
if (typeof window !== 'undefined') { window.caAppOrderedParties = caAppOrderedParties; }

// Race guard: prevents a slow response for a record the broker has since
// navigated away from (j/k, or closing the panel) from painting the wrong
// customer's tracker into the panel that's open now.
var caAppFetchSeq = 0;

function fetchCreditAppStatus(r) {
  var section = document.getElementById('ca-app-section');
  if (!section) return;
  section.style.display = 'none';   // hide any previous record's tracker immediately
  if (!r || !r.ID) return;
  var seq = ++caAppFetchSeq;
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  var qs = 'email=' + encodeURIComponent(email) + '&submission_id=' + encodeURIComponent(r.ID);
  fetch(BROKER_API_BASE + '/credit-app/status?' + qs)
    .then(function(res) { return res.ok ? res.json() : null; })
    .then(function(payload) {
      if (seq !== caAppFetchSeq) return;               // a newer record opened meanwhile
      if (!payload) return;                             // 404 (flag off) / non-200: stay hidden
      renderCreditAppSection(r, payload);
    })
    .catch(function() { /* degrade quietly -- no tracker section, not a broken panel */ });
}
if (typeof window !== 'undefined') { window.fetchCreditAppStatus = fetchCreditAppStatus; }

function renderCreditAppSection(r, payload) {
  var section = document.getElementById('ca-app-section');
  if (!section) return;
  var ordered = caAppOrderedParties(payload && payload.parties);
  if (!ordered.length) return;   // nothing to show -- stays hidden, not an empty shell

  var summaryEl = document.getElementById('ca-app-summary-text');
  if (summaryEl) summaryEl.textContent = CA_APP_SUMMARY[payload.status] || '';

  var rowsEl = document.getElementById('ca-app-rows');
  if (rowsEl) rowsEl.innerHTML = ordered.map(caAppRowHtml).join('');

  // CREDITAPP2 fix round 1: two different questions, two different sets.
  // "Has this party answered" is CA_APP_ANSWERED (completed/waived only) --
  // that is what each row's own state text already reflects, and it is what
  // rendering-side code should reach for whenever the question is whether a
  // reference has come back. It is deliberately NOT what gates the button
  // below: the nudge-all label and its show/hide threshold have to count the
  // set the button actually acts on, or "(2)" promises a second nudge the
  // click handler will not deliver. That set is CA_APP_NEEDS_NO_NUDGE's
  // complement -- the exact same filter that decides whether a row gets a
  // Nudge button in the first place (caAppRowHtml's own canNudge) -- so a
  // bounced party, which needs no nudge, is excluded from both the count and
  // the threshold, never just from the count.
  var nudgeable = ordered.filter(function(p) { return CA_APP_NEEDS_NO_NUDGE.indexOf(p.status) === -1; });
  var allRow = document.getElementById('ca-app-nudgeall-row');
  var allBtn = document.getElementById('ca-app-nudge-all');
  if (allRow && allBtn) {
    if (nudgeable.length > 1) {
      allRow.style.display = '';
      allBtn.textContent = 'Nudge all waiting (' + nudgeable.length + ')';
      allBtn.disabled = false;
      allBtn.onclick = function() {
        allBtn.disabled = true;
        section.querySelectorAll('.ca-app-nudge').forEach(function(btn) {
          if (!btn.disabled) caAppDoNudge(r, btn.dataset.slot, btn);
        });
      };
    } else {
      allRow.style.display = 'none';
    }
  }

  section.querySelectorAll('.ca-app-nudge').forEach(function(btn) {
    btn.addEventListener('click', function() { caAppDoNudge(r, btn.dataset.slot, btn); });
  });

  // CREDITAPP2 Task 7 -- report a problem. Toggle to the inline note form,
  // cancel back, or send -- wired the same per-render way Nudge already is
  // just above, since these rows are rebuilt on every render.
  section.querySelectorAll('.ca-app-report-problem').forEach(function(btn) {
    btn.addEventListener('click', function() { caAppShowReportForm(section, btn.dataset.slot); });
  });
  section.querySelectorAll('.ca-app-report-cancel').forEach(function(btn) {
    btn.addEventListener('click', function() { caAppHideReportForm(section, btn.dataset.slot); });
  });
  section.querySelectorAll('.ca-app-report-send').forEach(function(btn) {
    btn.addEventListener('click', function() { caAppSubmitReportProblem(r, btn.dataset.slot, section); });
  });

  section.style.display = '';
}
if (typeof window !== 'undefined') { window.renderCreditAppSection = renderCreditAppSection; }

function caAppShowReportForm(section, slot) {
  var row = section.querySelector('.ca-app-row[data-slot="' + slot + '"]');
  if (!row) return;
  var btn = row.querySelector('.ca-app-report-problem');
  var form = row.querySelector('.ca-app-report-form');
  if (btn) btn.style.display = 'none';
  if (form) {
    form.style.display = '';
    var note = form.querySelector('.ca-app-report-note');
    if (note) note.focus();
  }
}
if (typeof window !== 'undefined') { window.caAppShowReportForm = caAppShowReportForm; }

function caAppHideReportForm(section, slot) {
  var row = section.querySelector('.ca-app-row[data-slot="' + slot + '"]');
  if (!row) return;
  var btn = row.querySelector('.ca-app-report-problem');
  var form = row.querySelector('.ca-app-report-form');
  if (form) form.style.display = 'none';
  if (btn) btn.style.display = '';
}
if (typeof window !== 'undefined') { window.caAppHideReportForm = caAppHideReportForm; }

// The broker's one recovery action: a note, never an address (the server
// silently drops anything else in the body -- see
// credit_app_report_problem's own docstring). Every outcome, including the
// server's "already reported" 409, is shown verbatim in the row's own
// .ca-app-msg, the same discipline caAppHandleNudgeResult already follows for
// Nudge -- this never guesses at wording the server already sent.
function caAppSubmitReportProblem(r, slot, section) {
  var row = section.querySelector('.ca-app-row[data-slot="' + slot + '"]');
  if (!row) return;
  var form = row.querySelector('.ca-app-report-form');
  var noteEl = form ? form.querySelector('.ca-app-report-note') : null;
  var note = noteEl ? noteEl.value.trim() : '';
  var sendBtn = form ? form.querySelector('.ca-app-report-send') : null;
  var msgEl = caAppMsgEl(section, slot);
  if (!note) {
    if (msgEl) { msgEl.textContent = 'Say what looks wrong first.'; msgEl.className = 'ca-app-msg error'; }
    return;
  }
  if (sendBtn) sendBtn.disabled = true;
  if (msgEl) { msgEl.textContent = ''; msgEl.className = 'ca-app-msg'; }
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  fetch(BROKER_API_BASE + '/credit-app/report-problem', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, submission_id: r.ID, slot: slot, note: note })
  }).then(function(res) {
    return res.text().then(function(t) {
      var data = {}; try { data = t ? JSON.parse(t) : {}; } catch (e) {}
      return { status: res.status, data: data };
    });
  }).then(function(rr) {
    if (sendBtn) sendBtn.disabled = false;
    if (rr.status === 200) {
      if (form) form.style.display = 'none';
      var btn = row.querySelector('.ca-app-report-problem');
      if (btn) { btn.disabled = true; btn.textContent = 'Reported'; }
      if (msgEl) { msgEl.textContent = 'Sent to credit'; msgEl.className = 'ca-app-msg ok'; }
    } else {
      var reason = (rr.data && rr.data.error) || 'Could not send the report';
      if (msgEl) { msgEl.textContent = reason; msgEl.className = 'ca-app-msg error'; }
    }
  }).catch(function() {
    if (sendBtn) sendBtn.disabled = false;
    if (msgEl) { msgEl.textContent = 'Could not send the report. Check your connection.'; msgEl.className = 'ca-app-msg error'; }
  });
}
if (typeof window !== 'undefined') { window.caAppSubmitReportProblem = caAppSubmitReportProblem; }

function caAppMsgEl(section, slot) {
  return section.querySelector('.ca-app-msg[data-slot-msg="' + slot + '"]');
}

// One party's Nudge click (also fired per-row by "Nudge all waiting"). Success
// and every refusal are handled entirely from the server's own response --
// this never guesses at WHY a nudge was refused beyond what credit_app_store's
// CreditAppRefused text already says, and that text is shown verbatim.
function caAppDoNudge(r, slot, btn) {
  if (!btn || btn.disabled) return;
  var section = document.getElementById('ca-app-section');
  var msgEl = section ? caAppMsgEl(section, slot) : null;
  btn.disabled = true;
  btn.textContent = 'Nudging…';
  if (msgEl) { msgEl.textContent = ''; msgEl.className = 'ca-app-msg'; }
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  fetch(BROKER_API_BASE + '/credit-app/nudge', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, submission_id: r.ID, slot: slot })
  }).then(function(res) {
    return res.text().then(function(t) {
      var data = {}; try { data = t ? JSON.parse(t) : {}; } catch (e) {}
      return { status: res.status, data: data };
    });
  }).then(function(rr) { caAppHandleNudgeResult(rr, btn, msgEl); })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Nudge';
      if (msgEl) { msgEl.textContent = 'Could not nudge. Check your connection.'; msgEl.className = 'ca-app-msg error'; }
    });
}

// Split from caAppDoNudge so the decision logic (what a given server response
// means for the button) is testable without mocking fetch/timers.
function caAppHandleNudgeResult(rr, btn, msgEl) {
  if (rr.status === 200) {
    btn.textContent = 'Nudged';
    if (msgEl) { msgEl.textContent = 'Nudged just now'; msgEl.className = 'ca-app-msg ok'; }
    // A successful nudge starts the very cooldown record_nudge enforces server-side --
    // disable through it rather than let an immediate second click just 409.
    caAppScheduleReenable(btn, msgEl, CA_APP_NUDGE_COOLDOWN_HOURS);
    return;
  }
  if (rr.status === 409) {
    var reason = (rr.data && rr.data.error) || 'Could not nudge';
    if (reason === CA_APP_NUDGE_LIMIT_MSG) {
      caAppReplaceWithContact(btn);
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Nudge';
    if (msgEl) { msgEl.textContent = reason; msgEl.className = 'ca-app-msg error'; }
    var m = /nudged\s+(\d+)h ago/i.exec(reason);
    if (m) caAppScheduleReenable(btn, msgEl, CA_APP_NUDGE_COOLDOWN_HOURS - parseInt(m[1], 10));
    // else: an unrecognised refusal shape -- stay disabled with the message shown
    // rather than guess at a re-enable time.
    return;
  }
  btn.disabled = false;
  btn.textContent = 'Nudge';
  if (msgEl) { msgEl.textContent = 'Could not nudge. Try again.'; msgEl.className = 'ca-app-msg error'; }
}
if (typeof window !== 'undefined') { window.caAppHandleNudgeResult = caAppHandleNudgeResult; }

// Permanent refusal (three nudges already sent): the button stops being a
// button. credit@operfi.com is the one channel left for this party.
function caAppReplaceWithContact(btn) {
  var wrap = btn.closest('.ca-app-row-action');
  if (!wrap) return;
  wrap.innerHTML = '<div class="ca-app-contact">Contact <a href="mailto:credit@operfi.com">credit@operfi.com</a></div>';
}
if (typeof window !== 'undefined') { window.caAppReplaceWithContact = caAppReplaceWithContact; }

function caAppScheduleReenable(btn, msgEl, hoursRemaining) {
  btn.disabled = true;
  if (!(hoursRemaining > 0)) return;   // eligible again already -- next panel open picks it up
  var ms = Math.min(hoursRemaining, CA_APP_NUDGE_COOLDOWN_HOURS) * 3600000;
  var timer = setTimeout(function() {
    // The panel may have re-rendered (a different record, or this one closed)
    // long before this fires -- only touch the button if it's still on screen.
    if (btn && btn.isConnected) {
      btn.disabled = false; btn.textContent = 'Nudge';
      if (msgEl && msgEl.isConnected) msgEl.textContent = '';
    }
  }, ms);
  // A cooldown timer can run up to 48h out; unref it (where supported -- Node's
  // Timeout, not a browser timer id) so it can never itself hold a process/test
  // runner open. No-op in a real browser tab, which has no such concept.
  if (timer && typeof timer.unref === 'function') timer.unref();
}

// ── CREDITAPP1 Task 17 — the same tracker, compressed onto the LIST row ────
// Tom: "some sort of % completion bar on the main page so they can see it's in
// progress and entice them to click into it." One call for the whole list
// (/credit-app/status-bulk), never one fetch per row -- the list can hold 200
// customers. Same withholding discipline as the panel tracker above: the
// bulk endpoint sends only completed/total/waiting_on, never a risk/fraud
// signal, and this renders only what it receives.
var caAppBulkStatus = {};   // submission ID -> {status, completed, total, waiting_on}
var caAppBulkSeq = 0;

function fetchCreditAppStatusBulk() {
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  if (!email) return;
  var seq = ++caAppBulkSeq;
  // fetch may not exist at all in some test/embed contexts; a missing global is
  // exactly the same "show nothing extra" case as a 404 or a dropped connection.
  try {
    fetch(BROKER_API_BASE + '/credit-app/status-bulk?email=' + encodeURIComponent(email))
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(payload) {
        if (seq !== caAppBulkSeq) return;                // a newer list load overtook this one
        var apps = payload && payload.applications;
        if (!apps || typeof apps !== 'object') return;    // 404 (flag off) / malformed: leave list as-is
        caAppBulkStatus = apps;
        renderList();
      })
      .catch(function() { /* degrade quietly -- the list stays exactly as it is today */ });
  } catch (e) { /* fetch unavailable -- same quiet degrade */ }
}
if (typeof window !== 'undefined') { window.fetchCreditAppStatusBulk = fetchCreditAppStatusBulk; }

// A bar with no number is a decoration; a number alone is easy to miss -- always both.
// A completed application reads as done, not as a full bar that still looks like more
// work. Hover/focus names who we're waiting on, straight from waiting_on, the same
// neutral copy the panel tracker uses -- never a reason, never a risk signal.
function caAppRowProgressHtml(r) {
  var entry = r && r.ID ? caAppBulkStatus[r.ID] : null;
  if (!entry || !(entry.total > 0)) return '';   // no application on file -- row untouched
  var completed = entry.completed > 0 ? entry.completed : 0;
  var total = entry.total;
  if (completed >= total) {
    return '<div class="ca-app-rowprog-done">✓ Application complete</div>';
  }
  var pct = Math.max(0, Math.min(100, Math.round((completed / total) * 100)));
  var waiting = (entry.waiting_on || []).filter(Boolean);
  var tipLabel = completed + ' of ' + total + ' complete' +
    (waiting.length ? '. Waiting on ' + waiting.join('; ') : '');
  var tipHtml = waiting.length
    ? '<div class="ca-app-rowprog-tip"><div class="ca-app-rowprog-tip-title">Waiting on</div><ul>' +
        waiting.map(function(w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>'
    : '';
  return '' +
    '<div class="ca-app-rowprog-wrap" tabindex="0" role="group" aria-label="Credit application: ' + esc(tipLabel) + '">' +
      '<div class="ca-app-rowprog">' +
        '<div class="ca-app-rowprog-bar"><div class="ca-app-rowprog-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="ca-app-rowprog-text">' + completed + ' of ' + total + '</span>' +
      '</div>' +
      tipHtml +
    '</div>';
}
if (typeof window !== 'undefined') { window.caAppRowProgressHtml = caAppRowProgressHtml; }

// ── CUSTEVENT1 — the attention bell (OperFi staff only) ─────────────────────
// Tom, 2026-09-24: "if a trade ref completes a form and the customer is 20 down on
// the list ... can we make some sort of bell icon on the filter bubbles so our
// credit guy knows there was an update." One bulk call per list load
// (/customer-events?scope=operfi), same discipline as fetchCreditAppStatusBulk
// above: never a fetch per row, and any failure (403/404/malformed/network) leaves
// the screen exactly as it renders today. Staff only -- gated on allClients before
// the fetch is ever made, the same client-side mirror fetchCreditAppRisk uses
// ahead of its own staff-only endpoint; the server holds the real boundary.

function hasUnreadEvents(r) {
  return !!(r && r.ID && customerEventsBySubject[r.ID] && customerEventsBySubject[r.ID].length);
}
if (typeof window !== 'undefined') { window.hasUnreadEvents = hasUnreadEvents; }

// The type breakdown -- WHAT is waiting, not just how many customers. Reviewer-facing
// wording ("3 references"), not the API's internal kind string. Order here doubles as
// the display order, so a reviewer scans it the way they'd prioritize the afternoon.
var CUSTOMER_EVENT_KIND_LABELS = {
  reference_completed:    { one: 'reference',     many: 'references' },
  credit_boost_requested: { one: 'boost request', many: 'boost requests' },
  credit_app_received:    { one: 'application',   many: 'applications' },
  credit_check_submitted: { one: 'new check',     many: 'new checks' }
};
// A kind the backend adds before this screen knows its label still counts -- it just
// lands in one neutral bucket instead of being dropped or shown as a raw kind string.
var CUSTOMER_EVENT_KIND_FALLBACK = { one: 'update', many: 'updates' };

// Flattens every currently-unread event across every customer and groups by kind, in
// the label map's declared order, with any unrecognized kind rolled into one fallback
// bucket at the end.
function customerEventsKindCounts() {
  var counts = {};
  var fallbackCount = 0;
  Object.keys(customerEventsBySubject).forEach(function(subjectId) {
    (customerEventsBySubject[subjectId] || []).forEach(function(ev) {
      var kind = ev && ev.kind;
      if (kind && CUSTOMER_EVENT_KIND_LABELS[kind]) {
        counts[kind] = (counts[kind] || 0) + 1;
      } else {
        fallbackCount++;
      }
    });
  });
  var parts = [];
  Object.keys(CUSTOMER_EVENT_KIND_LABELS).forEach(function(kind) {
    if (counts[kind]) parts.push({ kind: kind, count: counts[kind], label: CUSTOMER_EVENT_KIND_LABELS[kind] });
  });
  if (fallbackCount) parts.push({ kind: '_other', count: fallbackCount, label: CUSTOMER_EVENT_KIND_FALLBACK });
  return parts;
}
if (typeof window !== 'undefined') { window.customerEventsKindCounts = customerEventsKindCounts; }

// "3 references", "1 boost request" -- singular/plural picked per count, not a
// tacked-on 's' ("1 references" reads as a bug).
function customerEventsKindPhrase(part) {
  return part.count + ' ' + (part.count === 1 ? part.label.one : part.label.many);
}

// The full breakdown text, shared by both surfaces (the bell's hover/focus tip and the
// active-filter line): "2 customers: 3 references · 1 boost request". The counts after
// the colon are EVENTS, the leading number is CUSTOMERS -- the chip's own number --
// spelled out so a reviewer never reads "3 references" under a "2" chip as a bug: one
// customer can carry more than one unread event, so events routinely outnumber
// customers.
function customerEventsBreakdownText() {
  var parts = customerEventsKindCounts();
  if (!parts.length) return '';
  var phrase = parts.map(customerEventsKindPhrase).join(' · ');
  return customerEventsTotal + ' ' + (customerEventsTotal === 1 ? 'customer' : 'customers') + ': ' + phrase;
}
if (typeof window !== 'undefined') { window.customerEventsBreakdownText = customerEventsBreakdownText; }

function fetchCustomerEventsBulk() {
  if (!allClients) return;
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  if (!email) return;
  var seq = ++customerEventsSeq;
  // fetch may not exist at all in some test/embed contexts -- same "show nothing
  // extra" outcome as a 404 or a dropped connection.
  try {
    fetch(BROKER_API_BASE + '/customer-events?email=' + encodeURIComponent(email) + '&scope=operfi')
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(payload) {
        if (seq !== customerEventsSeq) return;   // a newer list load overtook this one
        if (!payload || typeof payload !== 'object' || !Array.isArray(payload.events)) return;  // 403/404/malformed: leave as-is
        applyCustomerEventsPayload(payload);
      })
      .catch(function() { /* degrade quietly -- the bell simply never appears */ });
  } catch (e) { /* fetch unavailable -- same quiet degrade */ }
}
if (typeof window !== 'undefined') { window.fetchCustomerEventsBulk = fetchCustomerEventsBulk; }

function applyCustomerEventsPayload(payload) {
  customerEventsTotal = payload.total || 0;
  customerEventsCounts = payload.counts || {};
  var bySubject = {};
  (payload.events || []).forEach(function(ev) {
    if (!ev || !ev.subject_id) return;
    if (!bySubject[ev.subject_id]) bySubject[ev.subject_id] = [];
    bySubject[ev.subject_id].push(ev);   // server sends newest first; order is preserved
  });
  customerEventsBySubject = bySubject;
  if (customerEventsTotal <= 0) attentionFilterActive = false;  // the bell vanished -- stop filtering on it
  buildChips();
  applyFilters();
}
if (typeof window !== 'undefined') { window.applyCustomerEventsPayload = applyCustomerEventsPayload; }

// The row marker: the most recent event for this customer + a relative time, so the
// reason it got pulled up the list is visible without opening it. Same withholding
// discipline as caAppRowProgressHtml above -- only what the payload sent.
function customerEventRowMarkerHtml(r) {
  if (!allClients) return '';
  var list = r && r.ID ? customerEventsBySubject[r.ID] : null;
  if (!list || !list.length) return '';
  var latest = list[0];
  var when = latest.at ? fmtRelative(parseDate(latest.at)) : '';
  return '' +
    '<div class="ca-attn-marker">' +
      '<span class="ca-attn-bell" aria-hidden="true">🔔</span>' +
      '<span class="ca-attn-summary">' + esc(latest.summary || '') + '</span>' +
      (when ? '<span class="ca-attn-time">' + esc(when) + '</span>' : '') +
    '</div>';
}
if (typeof window !== 'undefined') { window.customerEventRowMarkerHtml = customerEventRowMarkerHtml; }

// The detail pane's list of unread events for the open customer, filled from the
// bulk fetch above -- opening a record makes no call of its own, so opening it can
// never itself clear anything. Absent from the DOM for a non-staff viewer
// (attnSectionHtml's own allClients gate); hidden here when this customer has
// nothing unread, same discipline as every other optional panel section.
function renderCustomerEventsSection(r) {
  var section = document.getElementById('ca-attn-section');
  if (!section) return;
  var body = document.getElementById('ca-attn-events');
  var row = document.getElementById('ca-attn-row');
  var msg = document.getElementById('ca-attn-msg');
  var clearBtn = document.getElementById('ca-attn-clear');
  if (msg) { msg.textContent = ''; msg.className = 'dec-msg'; }
  var list = r && r.ID ? customerEventsBySubject[r.ID] : null;
  if (!list || !list.length) {
    section.style.display = 'none';
    return;
  }
  body.innerHTML = list.map(function(ev) {
    var when = ev.at ? fmtDateTime(parseDate(ev.at)) : '';
    return '<div class="ca-attn-event">' +
      '<div class="ca-attn-event-summary">' + esc(ev.summary || '') + '</div>' +
      (when ? '<div class="ca-attn-event-time">' + esc(when) + '</div>' : '') +
    '</div>';
  }).join('');
  row.style.display = '';
  section.style.display = '';
  if (clearBtn) {
    clearBtn.disabled = false;
    clearBtn.textContent = 'Mark reviewed';
    clearBtn.addEventListener('click', function() { clearCustomerEvents(r, clearBtn, msg); });
  }
}
if (typeof window !== 'undefined') { window.renderCustomerEventsSection = renderCustomerEventsSection; }

// Clearing is explicit and team-wide: POST /customer-events/clear clears every
// unread event for this customer for the whole desk. Only a 200 updates local
// state, mirroring submitDecision's own error handling above.
function clearCustomerEvents(r, btn, msg) {
  if (!r || !r.ID) return;
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  btn.disabled = true;
  var origLabel = btn.textContent;
  btn.textContent = 'Marking reviewed…';
  if (msg) { msg.textContent = ''; msg.className = 'dec-msg'; }
  fetch(BROKER_API_BASE + '/customer-events/clear', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, subject_id: r.ID })
  }).then(function(res) {
    return res.text().then(function(t) {
      var d = {}; try { d = t ? JSON.parse(t) : {}; } catch (e) {}
      return { status: res.status, data: d };
    });
  }).then(function(rr) {
    if (rr.status === 200) {
      applyCustomerEventsClear(r.ID);
      showToast('Marked reviewed');
    } else {
      btn.disabled = false;
      btn.textContent = origLabel;
      if (msg) {
        msg.textContent = (rr.data && (rr.data.error || rr.data.message)) || 'Could not mark reviewed';
        msg.className = 'dec-msg error';
      }
    }
  }).catch(function() {
    btn.disabled = false;
    btn.textContent = origLabel;
    if (msg) { msg.textContent = 'Could not mark reviewed. Check your connection and try again.'; msg.className = 'dec-msg error'; }
  });
}
if (typeof window !== 'undefined') { window.clearCustomerEvents = clearCustomerEvents; }

// After a successful clear: drop the customer from local state, refresh the bell +
// list, and reposition the panel exactly like applyDecisionResult does above --
// stay open on the same record if it still matches the active filters, close it if
// the active bell filter just excluded it.
function applyCustomerEventsClear(subjectId) {
  if (customerEventsBySubject[subjectId]) {
    delete customerEventsBySubject[subjectId];
    delete customerEventsCounts[subjectId];
    customerEventsTotal = Math.max(0, customerEventsTotal - 1);
  }
  if (customerEventsTotal <= 0) attentionFilterActive = false;  // last one cleared -- the bell itself goes quiet
  buildChips();
  applyFilters();

  var target = null;
  for (var i = 0; i < allRecords.length; i++) {
    if (allRecords[i] && allRecords[i].ID === subjectId) { target = allRecords[i]; break; }
  }
  if (!target) return;
  var newIdx = filteredRecords.indexOf(target);
  if (newIdx !== -1) {
    openIndex = newIdx;
    renderPanel();
  } else {
    closePanel();
  }
}
if (typeof window !== 'undefined') { window.applyCustomerEventsClear = applyCustomerEventsClear; }

// ── CREDITAPP1 — Application Details (every broker) + full submission ──────
// Two more reads layered on the same submission the tracker above already
// names. /credit-app/application is the broker's own narrower read -- the
// server enforces the line (never EIN, owners, formation detail, the bank
// officer, any reference's answer, risk signals, or the PDF -- see
// credit_app_routes.py's _client_application_payload docstring) and this
// renders only the fields that payload sends, exactly the discipline the
// tracker above already follows for its own neutral copy. /credit-app/risk
// is OperFi-only and fetched ONLY when allClients is true -- the same
// client-side gate fetchFraudCheck above already uses ahead of its own
// staff-only endpoint. The server holds the real boundary (is_operfi_admin,
// checked first thing on that route); this gate just means a broker's
// account never makes the round trip it would 403 on anyway.

// Creator's r.Address shape (address_line_1/district_city/state_province/
// postal_Code) does not apply here -- the credit-app form stores
// {line1, suite, city, state, postal, country, formatted}, its own already-
// joined display string. Prefer `formatted`; fall back to building one for
// an older/partial record that predates it.
function caAppFormatAddress(addr) {
  if (!addr) return '';
  if (typeof addr === 'string') return addr;
  if (addr.formatted) return addr.formatted;
  var parts = [];
  if (addr.line1) parts.push(addr.line1);
  var cityState = [];
  if (addr.city) cityState.push(addr.city);
  if (addr.state) cityState.push(addr.state);
  var cityStateStr = cityState.join(', ');
  if (addr.postal) cityStateStr += (cityStateStr ? ' ' : '') + addr.postal;
  if (cityStateStr) parts.push(cityStateStr);
  return parts.join(', ');
}

// re-renders. Reads the submission id from panel.dataset.submissionId (set

// staleness reason documented at that assignment.
function wireCreditAppRecovery(panel) {
  if (!panel || panel.__creditAppRecoveryWired) return;
  panel.__creditAppRecoveryWired = true;
  panel.addEventListener('click', function(e) {
    var t = e.target;
    var correctBtn = t && t.closest ? t.closest('.ca-app-correct-address') : null;
    var waiveBtn = t && t.closest ? t.closest('.ca-app-waive') : null;
    if (correctBtn && panel.contains(correctBtn)) {

  });
}

// One shared POST helper for the two staff recovery actions -- same
// fetch/parse shape caAppDoNudge already uses for Nudge.
function caAppPostRecovery(path, payload, cb) {
  fetch(BROKER_API_BASE + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  }).then(function(res) {
    return res.text().then(function(t) {
      var data = {}; try { data = t ? JSON.parse(t) : {}; } catch (e) {}
      return { status: res.status, data: data };
    });
  }).then(cb).catch(function() { cb({ status: 0, data: {} }); });
}

// state -- the same three calls openPanel itself makes on first open.

  var id = panel.dataset.submissionId;

function caAppSubmitCorrectAddress(panel, btn) {
  var slot = btn.dataset.slot;
  var wrap = btn.closest('.ca-app-recovery');
  if (!wrap) return;
  var input = wrap.querySelector('.ca-app-address-input');
  var msgEl = wrap.querySelector('.ca-app-msg[data-recovery-msg="' + slot + '"]');
  var newEmail = input ? input.value.trim() : '';
  if (!newEmail || newEmail.indexOf('@') === -1) {
    if (msgEl) { msgEl.textContent = 'Enter a valid email address.'; msgEl.className = 'ca-app-msg error'; }
    return;
  }
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  btn.disabled = true;
  if (msgEl) { msgEl.textContent = 'Saving…'; msgEl.className = 'ca-app-msg'; }
  caAppPostRecovery('/credit-app/correct-address',
    { email: email, submission_id: panel.dataset.submissionId, slot: slot, new_email: newEmail },
    function(rr) {
      btn.disabled = false;
      if (rr.status === 200) {
        if (msgEl) { msgEl.textContent = 'Address corrected, survey resent'; msgEl.className = 'ca-app-msg ok'; }
        if (input) input.value = '';
        caAppRefreshPane(panel);
      } else {
        var reason = (rr.data && rr.data.error) || 'Could not correct the address';
        if (msgEl) { msgEl.textContent = reason; msgEl.className = 'ca-app-msg error'; }
      }
    });
}

function wireDecisionSection(rec) {
  var sel = document.getElementById('dec-decision');

  var limitInput = document.getElementById('dec-limit');

  function syncRequired() {
    var approved = sel.value === 'Approved';
    if (req) req.style.display = approved ? '' : 'none';
    if (!approved) limitInput.classList.remove('required-empty');
  }
  sel.addEventListener('change', function() { syncRequired(); setDecMsg(''); });

  function setDecMsg(text, kind) {
    if (!msg) return;
    msg.textContent = text || '';
    msg.className = 'dec-msg' + (kind ? ' ' + kind : '');
  }

  saveBtn.addEventListener('click', function() {
    var vals = { decision: sel.value, credit_limit: limitInput.value, credit_notes: notes.value };
    var approved = vals.decision === 'Approved';
    var noLimit = !vals.credit_limit || Number(vals.credit_limit) <= 0;
    if (approved && noLimit) {
      limitInput.classList.add('required-empty');
      setDecMsg('Credit limit required for Approved', 'error');
      limitInput.focus();
      return;
    }
    limitInput.classList.remove('required-empty');
    saveBtn.disabled = true;
    var origLabel = saveBtn.textContent;
    saveBtn.textContent = 'Saving…';
    setDecMsg('');
    submitDecision(rec, vals).then(function(resp) {
      saveBtn.disabled = false;
      saveBtn.textContent = origLabel;
      if (resp && resp.ok) {
        applyDecisionResult(rec, vals);
        showToast('Decision saved');
      } else {
        setDecMsg((resp && resp.error) || 'Could not save decision', 'error');
      }
    }).catch(function(err) {
      saveBtn.disabled = false;
      saveBtn.textContent = origLabel;
      console.error('[CustomerApprovals] submitDecision failed', err);
      setDecMsg('Could not save decision', 'error');
    });
  });
}

// After a successful write: update the record in allRecords, refresh KPIs, chips,
// re-render the affected row, and re-render the open panel so the pill/limit reflect it.
function applyDecisionResult(rec, vals) {
  var target = null;
  for (var i = 0; i < allRecords.length; i++) {
    if (allRecords[i] && allRecords[i].ID === rec.ID) { target = allRecords[i]; break; }
  }
  if (!target) target = rec;
  target.Credit_Decision = vals.decision;
  if (vals.credit_limit !== undefined && vals.credit_limit !== '') {
    target.Credit_Limit = vals.credit_limit;
  }
  if (vals.credit_notes !== undefined) target.Credit_Notes = vals.credit_notes;

  renderKpis();
  buildChips();
  applyFilters();   // re-renders the list (rows) against current filters

  // Keep the panel open on the same record; re-render it so the pill/limit update.
  var newIdx = filteredRecords.indexOf(target);
  if (newIdx !== -1) {
    openIndex = newIdx;
    renderPanel();
  } else {
    // Record filtered out by the active status chip — close the panel.
    closePanel();
  }
}

function collectFiles(field) {
  if (!field) return [];

    if (typeof f === 'string') {
      out.push({ name: fileNameFromPath(f) });
    } else {
      out.push({ name: f.filename || f.fileName || f.name || fileNameFromPath(f.filepath || '') || 'Uploaded file' });
    }
  });
  return out;
}

// Creator file fields arrive as ".../download?filepath=NAME" URLs. The real name is
// the filepath= value (URL-encoded); fall back to the path basename.
function fileNameFromPath(s) {
  s = String(s || '');
  var m = s.match(/[?&]filepath=([^&]+)/);
  if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
  return s.split('?')[0].split('/').pop() || 'Uploaded file';
}

function parseMoney(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;

}
function fmtMoney(n) {

}
function formatMoneyShort(v) {

}
function formatAddress(r) {

  if (!addr) return '';
  if (typeof addr === 'string') return addr;

  if (addr.address_line_1) parts.push(addr.address_line_1);

  if (addr.district_city)  cityState.push(addr.district_city);
  if (addr.state_province) cityState.push(addr.state_province);
  var cityStateStr = cityState.join(', ');
  if (addr.postal_Code) cityStateStr += (cityStateStr ? ' ' : '') + addr.postal_Code;
  if (cityStateStr) parts.push(cityStateStr);
  return parts.join(', ');
}
function mapsHref(addr){
  var s=String(addr||'').trim();
  return s ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s) : '';
}
function addressFieldHtml(addr){

}
if (typeof window !== 'undefined') {
  window.mapsHref = mapsHref; window.addressFieldHtml = addressFieldHtml;
  window.docsListHtml = docsListHtml; window.collectFiles = collectFiles;
  window.fileNameFromPath = fileNameFromPath; window.wireDocOpen = wireDocOpen;
  window.creditDocUrl = creditDocUrl; window.creditDocMime = creditDocMime;
  window.openCreditDoc = openCreditDoc;
}
function formatPhone(v) {
  if (!v) return '';
  var s = String(v).trim();
  // Don't double-prefix
  if (/^\+/.test(s)) return s;
  var digits = s.replace(/[^\d]/g, '');
  if (digits.length === 10) return '+1 ' + s;
  if (digits.length === 11 && digits[0] === '1') return '+' + digits[0] + ' ' + s.replace(/^1[\s-]?/, '');
  return s;
}
function parseDate(v) {
  if (!v) return null;
  // The digits are the Creator app's wall clock, and the app (funding-portal) is US/Central.
  // Building the Date from the local-naive constructor is DELIBERATE: it round-trips the digits
  // back out through toLocale* unchanged, whatever timezone the viewer is in, so what we render is
  // Central and fmtDateTime can simply label it "CT". Do NOT "fix" this into a real timezone
  // conversion without reworking that label — otherwise the digits shift and the CT label lies.
  // NB: only the regex branch below is digit-preserving. The new Date(v) fallback parses an
  // absolute instant and WOULD shift. Creator's dd-MMM-yyyy format always hits the regex.
  if (typeof v === 'string') {
    var m = v.match(/^(\d{2})-([A-Za-z]{3})-(\d{4})(?:\s+(\d{2}):(\d{2}):(\d{2}))?$/);
    if (m) {
      var months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      return new Date(parseInt(m[3], 10), months[m[2]], parseInt(m[1], 10),
        m[4] ? parseInt(m[4], 10) : 0, m[5] ? parseInt(m[5], 10) : 0, m[6] ? parseInt(m[6], 10) : 0);
    }
  }
  var d = new Date(v);
  return isNaN(d) ? null : d;
}
// Returns a NEW sorted array; never mutates `records`. sortKey defaults to
// the module-level currentSort so production call sites can omit it.
// Missing/unparseable Added_Time always sorts last in 'newest'/'oldest'.
function sortRecords(records, sortKey) {
  var key = sortKey || currentSort;
  var arr = records.slice();
  if (key === 'name_asc' || key === 'name_desc') {
    var dir = key === 'name_asc' ? 1 : -1;
    arr.sort(function(a, b) {
      return dir * (a.Customer_Company_Name || '').toLowerCase()
                     .localeCompare((b.Customer_Company_Name || '').toLowerCase());
    });
    return arr;
  }
  // 'newest' (default) or 'oldest'
  var sign = key === 'oldest' ? 1 : -1;
  arr.sort(function(a, b) {
    var da = parseDate(a.Added_Time), db = parseDate(b.Added_Time);
    if (!da && !db) return 0;
    if (!da) return 1;   // missing dates always sort last
    if (!db) return -1;
    return sign * (da.getTime() - db.getTime());
  });
  return arr;
}
window.sortRecords = sortRecords;  // exposed for tests (SORT2)
function fmtTime(d) {
  // Added_Time is already Central wall clock (the funding-portal Creator app is US/Central), and
  // parseDate builds a local-naive Date that round-trips those digits unchanged for any viewer.
  // So we label the zone rather than convert. "CT" not "CST": US/Central observes DST.
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' CT';
}
function fmtDateShort(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtDateTime(d) {
  // Midnight means a date-only value: a bulk import, or a date-only write like
  // Credit_Decision_Date (a datetime field the backend stamps with a date-only format). Showing
  // date only avoids a meaningless "12:00 AM", and is also what keeps the CT label off calendar
  // dates, which have no zone to label.
  var midnight = d.getHours() === 0 && d.getMinutes() === 0 && d.getSeconds() === 0;
  return midnight ? fmtDateShort(d) : fmtDateShort(d) + ' · ' + fmtTime(d);
}
window.fmtDateTime = fmtDateTime;  // exposed for tests
window.parseDate = parseDate;      // exposed for tests
function fmtRelative(d) {
  if (!d) return '';
  var diffMs = Date.now() - d.getTime();
  var diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1)  return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  var diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24)  return diffHr + 'h ago';
  var diffD = Math.floor(diffHr / 24);
  if (diffD === 1)  return 'yesterday';
  if (diffD < 7)    return diffD + 'd ago';
  if (diffD < 30)   return Math.floor(diffD / 7) + 'w ago';
  return 'on ' + fmtDateShort(d);
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(ch) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
  });
}

}

}

        '<input id="cb-ack" type="checkbox" style="margin-top:2px;"><span>I understand the credit boost fee is charged even if the requested limit cannot be obtained.</span></label>' +
      '<div id="cb-msg" style="color:#b42318;font-size:13px;min-height:16px;margin-top:8px;"></div>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">' +
        '<button id="cb-cancel" class="row-action" style="background:#fff;">Cancel</button>' +
        '<button id="cb-submit" class="row-action" style="background:var(--of-orange,#f97316);color:#fff;">Submit request</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  var submitBtn = overlay.querySelector('#cb-submit');
  var msg = overlay.querySelector('#cb-msg');
  var amountWrap = overlay.querySelector('#cb-amount-wrap');
  var amountInput = overlay.querySelector('#cb-amount');
  var bandWrap = overlay.querySelector('#cb-band-wrap');
  var agreementInput = overlay.querySelector('#cb-agreement');
  var coiInput = overlay.querySelector('#cb-coi');
  var ackRow = overlay.querySelector('#cb-ack-row');

  function setErr(el, on) {
    if (!el) return;
    el.style.outline = on ? '2px solid #d92d20' : '';
    el.style.outlineOffset = on ? '2px' : '';
  }
  function state() {
    var bandEl = overlay.querySelector('input[name="cb-band"]:checked');
    var band = bandEl ? bandEl.value : '';
    var raw = (amountInput.value || '').trim();
    // "Up to $50,000" records the $50,000 ceiling; "Over $50,000" uses the entered amount.
    var amount = band === 'Over $50,000' ? raw : (band === 'Up to $50,000' ? '50000' : '');
    return {
      band: band, amount: amount,
      agreement: (agreementInput.files || [])[0] || null,
      coi: (coiInput.files || [])[0] || null,
      ack: overlay.querySelector('#cb-ack').checked
    };
  }
  function refresh() {
    var s = state();
    amountWrap.style.display = (s.band === 'Over $50,000') ? '' : 'none';
    // Clear the red highlight on each field once it's satisfied.
    if (s.band) setErr(bandWrap, false);
    if (s.agreement) setErr(agreementInput, false);
    if (s.coi) setErr(coiInput, false);
    if (s.ack) setErr(ackRow, false);
    if (s.band !== 'Over $50,000' || parseFloat(s.amount) > 50000) setErr(amountInput, false);
    if (creditBoostReady(s)) msg.textContent = '';
  }
  overlay.addEventListener('input', refresh);
  overlay.addEventListener('change', refresh);
  overlay.querySelector('#cb-cancel').onclick = function () { overlay.remove(); };
  submitBtn.onclick = function () {
    var s = state();
    if (!creditBoostReady(s)) {
      // Highlight exactly what's missing instead of silently doing nothing.
      var missing = [];
      if (!s.band) { setErr(bandWrap, true); missing.push('requested limit'); }
      if (s.band === 'Over $50,000' && !(parseFloat(s.amount) > 50000)) { setErr(amountInput, true); missing.push('a desired limit over $50,000'); }
      if (!s.agreement) { setErr(agreementInput, true); missing.push('Customer Agreement'); }
      if (!s.coi) { setErr(coiInput, true); missing.push('Certificate of Insurance'); }
      if (!s.ack) { setErr(ackRow, true); missing.push('the fee acknowledgment'); }
      msg.textContent = 'Please complete: ' + missing.join(', ') + '.';
      return;
    }
    submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
    submitCreditBoost(recId, { band: s.band, amount: s.amount }, { agreement: s.agreement, coi: s.coi })
      .then(function (r) {
        if (r && r.ok) { overlay.remove(); markBoostRequested(recId); }
        else { msg.textContent = (r && (r.detail || r.error)) || 'Request failed.'; submitBtn.disabled = false; submitBtn.textContent = 'Submit request'; }
      })
      .catch(function (e) { msg.textContent = (e && e.message) || 'Network error.'; submitBtn.disabled = false; submitBtn.textContent = 'Submit request'; });
  };
}

if (typeof window !== 'undefined') {
  window.creditBoostReady = creditBoostReady;
  window.submitCreditBoost = submitCreditBoost;
  window.markBoostRequested = markBoostRequested;
  window.openCreditBoost = openCreditBoost;
}

// ── CSV export ────────────────────────────────────────────────────────────
function exportCsv() {
  if (!filteredRecords.length) return;
  var headers = ['Submitted','Decision Date','Status','Customer','Address','POC','Email','Phone','Website','Credit Limit','Credit Notes'];
  var rows = filteredRecords.map(function(r) {
    var added = parseDate(r.Added_Time);
    var decided = parseDate(r.Credit_Decision_Date);
    return [
      added ? fmtDateTime(added) : '',
      decided ? fmtDateTime(decided) : '',
      statusMeta(r).label,
      r.Customer_Company_Name || '',
      formatAddress(r),
      r.Customer_Point_of_Contact || '',
      r.Email || '',
      r.Phone_Number1 || r.Phone_Number || '',
      urlVal(r.Company_Website),
      parseMoney(r.Credit_Limit).toFixed(2),
      (r.Credit_Notes || '').replace(/\s+/g, ' ')
    ];
  });
  var csv = [headers].concat(rows).map(function(row) {
    return row.map(function(cell) {
      var s = String(cell);
      if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'customer_approvals_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

})();
</script>
</body>
</html>
