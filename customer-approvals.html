<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Approvals</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  background: #f0efe9;
  color: #333;
  min-height: 100vh;
}
.widget { max-width: 1320px; margin: 0 auto; padding: 20px 24px 60px; }

/* Header */
.widget-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.widget-title { font-size: 22px; font-weight: 700; color: #272727; letter-spacing: -0.2px; }
.widget-sub { font-size: 12px; color: #888; margin-top: 4px; }
.header-actions { display: flex; gap: 8px; }
.btn {
  background: #fff; border: 1px solid #d8d8d8; border-radius: 6px;
  padding: 8px 14px; font-size: 13px; font-weight: 600; color: #444;
  cursor: pointer; transition: all 0.15s; font-family: inherit;
}
.btn:hover { border-color: #b8b8b8; background: #fafafa; }
.btn.primary { background: #272727; color: #fff; border-color: #272727; }
.btn.primary:hover { background: #1a1a1a; }
.btn .ic { margin-right: 6px; opacity: 0.7; }

/* KPI strip */
.kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi {
  background: #fff; border: 1px solid #e6e3da; border-radius: 10px;
  padding: 14px 16px; position: relative; overflow: hidden;
}
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #e8a020; }
.kpi.approved::before { background: #2e7d32; }
.kpi.awaiting::before { background: #f5a623; }
.kpi.denied::before { background: #c62828; }
.kpi.value::before { background: #272727; }
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #888; font-weight: 600; }
.kpi-value { font-size: 24px; font-weight: 700; color: #272727; margin-top: 4px; letter-spacing: -0.4px; }
.kpi-value .small { font-size: 14px; color: #888; font-weight: 500; }

/* Toolbar */
.toolbar {
  background: #fff; border: 1px solid #e6e3da; border-radius: 10px;
  padding: 10px 12px; display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.search { flex: 1; min-width: 240px; position: relative; }
.search input {
  width: 100%; border: 1px solid #d8d8d8; border-radius: 6px;
  padding: 9px 12px 9px 36px; font-size: 13px; font-family: inherit;
  background: #fafafa; outline: none; transition: all 0.15s;
}
.search input:focus { border-color: #e8a020; background: #fff; box-shadow: 0 0 0 3px rgba(232,160,32,0.12); }
.search-ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid #d8d8d8; background: #fff; border-radius: 999px;
  padding: 7px 13px; font-size: 12px; font-weight: 600; color: #555;
  cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  user-select: none;
}
.chip:hover { border-color: #b8b8b8; }
.chip.active { background: #272727; color: #fff; border-color: #272727; }
.chip .count { background: rgba(0,0,0,0.07); border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
.chip.active .count { background: rgba(255,255,255,0.18); }

/* List rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  background: #fff; border: 1px solid #e6e3da; border-radius: 10px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1.6fr 1.4fr 0.9fr 1.1fr 1.1fr 28px;
  gap: 14px; align-items: center;
  cursor: pointer; transition: all 0.12s; position: relative;
}
.row:hover { border-color: #c8c4b6; box-shadow: 0 2px 6px rgba(0,0,0,0.04); transform: translateY(-1px); }
.row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 10px 0 0 10px; background: #ddd; }
.row.s-approved::before  { background: #2e7d32; }
.row.s-awaiting::before  { background: #f5a623; }
.row.s-pending-app::before { background: #f5a623; }
.row.s-app-sent::before  { background: #d35400; }
.row.s-app-rcvd::before  { background: #1976d2; }
.row.s-boost::before     { background: #1976d2; }
.row.s-denied::before    { background: #c62828; }
.row.s-expired::before   { background: #888; }

.cell-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #999; font-weight: 600; margin-bottom: 2px; }
.cell-val { font-size: 13px; color: #272727; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-sub { font-size: 11px; color: #888; margin-top: 1px; font-weight: 500; }
.cell-val.lg { font-size: 14px; }

.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.2px; text-transform: uppercase; white-space: nowrap;
}
.status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-pill.approved { background: #e3f4e3; color: #1f6321; }
.status-pill.awaiting { background: #fff4e0; color: #b86e00; }
.status-pill.pending-app { background: #fff4e0; color: #b86e00; }
.status-pill.app-sent { background: #ffe9d9; color: #a13e00; }
.status-pill.app-rcvd { background: #e3f0fb; color: #0d4a8a; }
.status-pill.boost { background: #e3f0fb; color: #0d4a8a; }
.status-pill.denied { background: #fde4e4; color: #a31818; }
.status-pill.expired { background: #ececec; color: #555; }

.row-action {
  background: #fff; border: 1px solid #d8d8d8; border-radius: 6px;
  padding: 7px 12px; font-size: 11px; font-weight: 700; color: #444;
  cursor: pointer; transition: all 0.12s;
  text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
  font-family: inherit;
}
.row-action:hover { border-color: #e8a020; color: #e8a020; }
.row-action.primary { background: #e8a020; color: #fff; border-color: #e8a020; }
.row-action.primary:hover { background: #d49018; border-color: #d49018; color: #fff; }
.row-action-placeholder { font-size: 11px; color: #aaa; font-style: italic; }

.chev { color: #ccc; transition: color 0.12s, transform 0.12s; text-align: right; }
.row:hover .chev { color: #888; transform: translateX(2px); }

/* States */
.state {
  background: #fff; border: 1px solid #e6e3da; border-radius: 10px;
  padding: 60px 24px; text-align: center; color: #888;
}
.state-title { font-size: 16px; font-weight: 600; color: #555; margin-bottom: 6px; }
.state-msg { font-size: 13px; }
.state .spinner {
  width: 28px; height: 28px;
  border: 3px solid #e6e3da;
  border-top-color: #e8a020;
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 18px; padding: 0 4px;
  font-size: 12px; color: #888;
}

/* Allow grid children to shrink so `text-overflow: ellipsis` actually kicks in
   instead of cells expanding to their content's natural width. */
.row > div { min-width: 0; }
.kpi { min-width: 0; }

@media (max-width: 900px) {
  .widget-header { flex-direction: column; align-items: stretch; }
  .header-actions { flex-wrap: wrap; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .kpi-value { font-size: 20px; }
  .row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .cell-chev { display: none; }
}

@media (max-width: 600px) {
  .page { padding: 16px 12px 40px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .kpi { padding: 12px 14px; }
  .kpi-value { font-size: 18px; }
  .toolbar { padding: 8px; gap: 8px; }
  .chip { padding: 6px 11px; font-size: 11px; }
  .row {
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 12px 14px;
  }
  .row .cell-chev { display: none; }
  .cell-val { white-space: normal; }
  .cell-val.lg { font-size: 14px; line-height: 1.3; }
}

/* ===== Slide-in detail panel ===== */
.scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.32);
  z-index: 90;
  backdrop-filter: blur(2px);
  display: none;
  animation: fadeIn 0.18s ease-out;
}
.scrim.show { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 580px; max-width: 100vw;
  background: #f7f6f1;
  z-index: 100;
  box-shadow: -8px 0 32px rgba(0,0,0,0.12);
  display: none;
  flex-direction: column;
  animation: slideIn 0.22s ease-out;
}
.panel.show { display: flex; }
@keyframes slideIn {
  from { transform: translateX(20px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

.panel-top { background: #272727; color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.panel-top .nav-btn {
  width: 28px; height: 28px; border-radius: 6px;
  background: rgba(255,255,255,0.08);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; font-size: 14px; transition: background 0.12s;
}
.panel-top .nav-btn:hover { background: rgba(255,255,255,0.16); }
.panel-top .nav-btn.disabled { opacity: 0.35; cursor: not-allowed; }
.panel-top .position { font-size: 11px; color: rgba(255,255,255,0.55); font-weight: 600; letter-spacing: 0.3px; }
.panel-top .spacer { flex: 1; }
.panel-top .close-btn {
  width: 30px; height: 30px; border-radius: 6px;
  background: rgba(255,255,255,0.08);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; font-size: 16px; transition: background 0.12s;
}
.panel-top .close-btn:hover { background: rgba(255,255,255,0.18); }

.panel-header { background: #272727; color: #fff; padding: 0 22px 22px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.panel-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: rgba(255,255,255,0.5); font-weight: 700; margin-bottom: 4px; }
.panel-customer { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 8px; }
.panel-meta { display: flex; gap: 14px; align-items: center; font-size: 13px; color: rgba(255,255,255,0.7); flex-wrap: wrap; }
.panel-meta .dot { color: rgba(255,255,255,0.3); }

.panel-status-row { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
.panel-status-row .status-pill { font-size: 11px; padding: 5px 11px; }

.panel-body { flex: 1; overflow-y: auto; padding: 18px 22px 24px; }
.panel-section { background: #fff; border: 1px solid #e6e3da; border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
.panel-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px;
  color: #888; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.panel-section-title::after { content: ''; flex: 1; height: 1px; background: #f0efe9; }

.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.field-grid.full > .field { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field-label { font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
.field-val { font-size: 14px; color: #272727; font-weight: 600; word-break: break-word; }
.field-val.muted { color: #888; font-weight: 500; }
.field-val.lg { font-size: 18px; letter-spacing: -0.2px; }
.field-val.empty { color: #bbb; font-weight: 500; font-style: italic; }
.field-val a { color: #b86e00; text-decoration: none; }
.field-val a:hover { text-decoration: underline; }

.credit-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.credit-card { background: #fafafa; border: 1px solid #f0efe9; border-radius: 8px; padding: 10px 12px; }
.credit-card.approved { background: #f1f9f1; border-color: #c8e3c8; }
.credit-card.denied { background: #fdf2f2; border-color: #f0c6c6; }
.credit-card .field-label { margin-bottom: 4px; }

.note-block {
  background: #fafaf6; border: 1px solid #f0efe9; border-radius: 8px;
  padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #444;
  white-space: pre-wrap; word-break: break-word;
}

/* ===== Decision section (see-all / role context only) ===== */
.panel-section.decision { border-color: #d8d4c4; box-shadow: 0 0 0 2px rgba(232,160,32,0.06); }
.dec-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.dec-field:last-of-type { margin-bottom: 0; }
.dec-label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.dec-label .req { color: #c62828; margin-left: 3px; }
.dec-input, .dec-select, .dec-textarea {
  width: 100%; border: 1px solid #d8d8d8; border-radius: 6px;
  padding: 9px 11px; font-size: 13px; font-family: inherit;
  background: #fafafa; color: #272727; outline: none; transition: all 0.15s;
}
.dec-input:focus, .dec-select:focus, .dec-textarea:focus {
  border-color: #e8a020; background: #fff; box-shadow: 0 0 0 3px rgba(232,160,32,0.12);
}
.dec-textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.dec-input.required-empty { border-color: #c62828; background: #fdf6f6; }
.dec-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.dec-row .btn { white-space: nowrap; }
.dec-msg { font-size: 12px; font-weight: 600; flex: 1; }
.dec-msg.error { color: #a31818; }
.dec-msg.ok { color: #1f6321; }

/* Toast */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #272727; color: #fff; padding: 11px 20px; border-radius: 8px;
  font-size: 13px; font-weight: 600; z-index: 200; box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok::before { content: '✓ '; }

.docs-list { display: flex; flex-direction: column; gap: 8px; }
.doc-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; background: #fafafa;
  border: 1px solid #f0efe9; border-radius: 8px;
  transition: all 0.12s;
}
/* Clickable doc cards (open in the shared viewer) */
button.doc-item { width: 100%; text-align: left; font: inherit; cursor: pointer; }
button.doc-item:hover { background: #fff4e0; border-color: #f0d8a8; }
button.doc-item:focus-visible { outline: 2px solid #b86e00; outline-offset: 1px; }
.doc-view { font-size: 11px; font-weight: 700; color: #b86e00; flex-shrink: 0; }
.doc-icon {
  width: 32px; height: 32px;
  background: #fff4e0; color: #b86e00;
  border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px; flex-shrink: 0;
}
.doc-info { flex: 1; min-width: 0; }
.doc-name { font-size: 13px; font-weight: 600; color: #272727; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { font-size: 11px; color: #999; }
.doc-empty { font-size: 12px; color: #aaa; font-style: italic; padding: 6px 2px; }

.panel-footer {
  border-top: 1px solid #e6e3da;
  background: #fff;
  padding: 12px 22px;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; gap: 10px;
}
.panel-footer .actions { display: flex; gap: 8px; }
.kbd {
  display: inline-block; background: #f0efe9;
  border: 1px solid #e0ddd2; border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 6px;
  font-family: ui-monospace, 'SF Mono', monospace;
  font-size: 10px; font-weight: 700;
  color: #555;
  margin: 0 2px;
}
.kbd-hints { font-size: 11px; color: #888; }

/* ===== Mobile (<=640px): stacked labeled cards + panel full screen ===== */
@media (max-width: 640px) {
  html, body { overflow-x: hidden; }
  .widget { padding: 14px 12px 40px; max-width: 100%; }
  .widget-header { flex-direction: column; align-items: stretch; gap: 12px; }
  .header-actions { flex-wrap: wrap; }
  .header-actions .btn { flex: 1 1 auto; }

  /* P2 — stack KPIs + toolbar */
  .kpi-row { grid-template-columns: 1fr !important; gap: 8px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .search { min-width: 0; width: 100%; }

  /* P3-equivalent — grid row list becomes single-column labeled cards */
  .row { grid-template-columns: 1fr !important; gap: 8px; }
  .row .cell-chev { display: none; }
  .cell-val { white-space: normal; }
  .row-action { width: 100%; }

  /* P5 — slide-in detail panel near full screen */
  .panel { width: 100% !important; max-width: 100% !important; }
  .field-grid { grid-template-columns: 1fr !important; }
  .credit-summary { grid-template-columns: 1fr !important; }

  /* P6 — tap targets + no iOS zoom */
  .btn, .chip, .row-action { min-height: 44px; }
  input, select, textarea, .search input { font-size: 16px; }
}
/* CC2 — credit-team domain/fraud check */
.ca-fraud-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-left: 6px; }
.ca-fraud-badge.high { background:#fdecea; color:#c62828; }
.ca-fraud-badge.medium { background:#fff4e0; color:#b25e00; }
.ca-fraud-badge.low { background:#e8f5e9; color:#2e7d32; }
.ca-fraud-badge.unknown { background:#eee; color:#777; }
.ca-fraud-reasons { margin: 6px 0 0; padding-left: 18px; color:#c62828; font-size: 12px; }
.ca-fraud-reasons li { margin: 2px 0; }
.ca-fraud-clean { font-size: 12px; color:#666; }
.ca-fraud-meta { margin-top: 8px; font-size: 11px; color:#999; }
.ca-contacts-head { display:flex; justify-content:space-between; align-items:center; }
.ca-edit-billing-btn { border:1px solid #d8d8d8; background:#fff; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:600; color:#555; cursor:pointer; font-family:inherit; text-transform:none; letter-spacing:0; }
.ca-edit-billing-btn:hover { border-color:#b8b8b8; background:#fafafa; }

/* BPOC1 — an approved customer with no billing contact on file. Amber, deliberately
   NOT the denied red: nothing is wrong with the credit decision, there is just one
   more step before this customer can carry a load. */
.billing-warn { margin-top:4px; font-size:11px; font-weight:600; color:#8a5a00; display:flex; align-items:center; gap:4px; }

/* BPOC2 — the same warning riding the status pill. The row line is easy to skim past
   and this generates real support calls, so it is flagged twice on purpose. Sits
   OUTSIDE the pill: inside it would inherit the approved green and read as part of the
   status, rather than as "approved, but". */
.pill-cell { display:inline-flex; align-items:center; }
.pill-warn { position:relative; display:inline-flex; align-items:center; margin-left:6px; font-size:13px; line-height:1; color:#b8860b; cursor:help; }
/* Amber, not near-black: the detail panel's header is #272727, so a dark tooltip would
   be invisible there. Amber reads on both the white row and the dark header, and ties
   the tip to the warning it explains. */
.pill-warn .pill-tip {
  position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%);
  background:#8a5a00; color:#fff; padding:6px 9px; border-radius:6px;
  font-size:11px; font-weight:600; line-height:1.3; letter-spacing:0; text-transform:none;
  white-space:nowrap; opacity:0; visibility:hidden; transition:opacity .12s; pointer-events:none; z-index:30;
}
.pill-warn .pill-tip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#8a5a00; }
.pill-warn:hover .pill-tip { opacity:1; visibility:visible; }
/* On the dark panel header the goldenrod glyph goes muddy, and the row's 8px flex gap
   already spaces it. */
.panel-status-row .pill-warn { color:#f0b849; margin-left:0; }
.ca-billing-alert { margin-top:14px; border:1px solid #f0d9a8; background:#fdf7ea; border-radius:8px; padding:12px 14px; display:flex; align-items:flex-start; gap:10px; }
.ca-billing-alert .cba-body { flex:1; }
.ca-billing-alert .cba-title { font-size:12px; font-weight:700; color:#8a5a00; margin-bottom:3px; }
.ca-billing-alert .cba-msg { font-size:12px; color:#6b5426; line-height:1.45; }
.ca-billing-alert .cba-fix { flex-shrink:0; border:1px solid #d9ab55; background:#fff; border-radius:6px; padding:5px 12px; font-size:11px; font-weight:700; color:#8a5a00; cursor:pointer; font-family:inherit; }
.ca-billing-alert .cba-fix:hover { background:#fffaf0; border-color:#c2942f; }

/* CREDITAPP1 — Application Details (every broker) + full submission (OperFi staff only) */
.ca-app-doc-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #b86e00; margin: 18px 0 10px; }
.ca-app-doc-head:first-child { margin-top: 0; }
.ca-app-detail-refs { display: flex; flex-direction: column; gap: 8px; }
.ca-app-detail-ref { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: #fafafa; border: 1px solid #f0efe9; border-radius: 8px; font-size: 12px; }
.ca-app-detail-ref-slot { font-weight: 700; color: #272727; }
.ca-app-detail-ref-who { color: #444; }
.ca-app-detail-ref-state { font-weight: 600; text-align: right; white-space: nowrap; }
.ca-app-detail-ref-addr { grid-column: 1 / -1; color: #888; font-size: 11px; }
.ca-app-staff-ref { border: 1px solid #f0efe9; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: #fafafa; }
.ca-app-staff-ref-head { font-size: 12px; font-weight: 700; color: #272727; margin-bottom: 8px; }
.ca-app-staff-risk { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-bottom: 8px; background: #eee; color: #777; }
.ca-app-staff-risk-high { background:#fdecea; color:#c62828; }
.ca-app-staff-risk-medium { background:#fff4e0; color:#b25e00; }
.ca-app-staff-risk-low { background:#e8f5e9; color:#2e7d32; }
.ca-app-staff-aging { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 8px; margin-top: 10px; }
.ca-app-staff-aging-cell { background: #fff; border: 1px solid #f0efe9; border-radius: 6px; padding: 6px 8px; }
@media (max-width: 640px) {
  .ca-app-detail-ref { grid-template-columns: 1fr; }
  .ca-app-detail-ref-state { text-align: left; }
}

/* CREDITAPP1 — the broker's own Credit Application tracker (Task 16). Reuses the
   panel-section shell; stays hidden until /credit-app/status answers 200 with at
   least one party, so an application that predates this build (or the feature
   flag off) renders this section as nothing, never as a broken panel. */
.ca-app-summary { font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 600; color: #999; margin-left: 8px; }
.ca-app-rows { display: flex; flex-direction: column; gap: 10px; }
.ca-app-row {
  display: grid; grid-template-columns: 1.3fr 1.4fr auto; gap: 10px; align-items: center;
  padding: 10px 12px; background: #fafafa; border: 1px solid #f0efe9; border-radius: 8px;
}
.ca-app-row-label { font-size: 13px; font-weight: 700; color: #272727; }
.ca-app-row-who { font-size: 12px; color: #777; margin-top: 2px; }
.ca-app-row-state { font-size: 12px; font-weight: 600; }
.ca-app-state-waiting, .ca-app-state-expired, .ca-app-state-opened { color: #b86e00; }
.ca-app-state-completed { color: #1f6321; }
.ca-app-state-not-required { color: #999; }
/* Bounced is the one state the broker can actually fix -- their own customer gave
   a bad address -- so it gets the same alert-red as a denied decision, not amber. */
.ca-app-state-bounced { color: #a31818; }
.ca-app-row-action { text-align: right; }
.ca-app-row-action .row-action { padding: 6px 11px; }
.ca-app-msg { font-size: 11px; margin-top: 4px; color: #888; }
.ca-app-msg.error { color: #a31818; }
.ca-app-msg.ok { color: #1f6321; }
.ca-app-contact { font-size: 12px; color: #555; white-space: nowrap; }
.ca-app-contact a { color: #b86e00; text-decoration: none; }
.ca-app-contact a:hover { text-decoration: underline; }
.ca-app-nudgeall-row { margin-top: 12px; text-align: right; }
@media (max-width: 640px) {
  .ca-app-row { grid-template-columns: 1fr; }
  .ca-app-row-action { text-align: left; }
}

/* CREDITAPP2 Task 7 -- a stalled reference overlays the waiting state, never a
   new pill colour: the party's status is still 'sent', so it stays amber, just
   heavier, next to copy anchored to the one clock the payload actually sends
   (waiting_days from sent_at -- see caAppRowHtml). */
.ca-app-state-stalled { font-weight: 700; }

/* The broker's "report a problem" control -- available on every reference row,
   same as Nudge, never on the customer's own application row (the server has
   no correction path for that slot). Reuses .row-action for the button and
   .ca-app-msg for the outcome line, so it never invents a new component. */
.ca-app-row-action .row-action + .row-action { margin-left: 6px; }
.ca-app-report-form { margin-top: 8px; text-align: left; }
.ca-app-report-note {
  width: 100%; min-height: 46px; font-size: 12px; font-family: inherit;
  border: 1px solid #d8d8d8; border-radius: 6px; padding: 6px 8px; resize: vertical; box-sizing: border-box;
}
.ca-app-report-btns { margin-top: 6px; text-align: right; }

/* Staff-only recovery, OperFi staff only -- lives inside the Full Submission
   block (allClients-gated at the DOM level, same as the rest of that section),
   so this never needs its own gate. */
.ca-app-recovery { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e3e0d5; display: flex; flex-direction: column; gap: 8px; }
.ca-app-recovery-row { display: flex; gap: 6px; align-items: center; }
.ca-app-recovery-input {
  flex: 1; font-size: 12px; font-family: inherit; border: 1px solid #d8d8d8;
  border-radius: 6px; padding: 6px 8px; box-sizing: border-box;
}

/* CREDITAPP1 Task 17 — the same tracker's progress, compressed onto the LIST row
   so a broker sees an application moving without opening the panel. One bulk call
   (/credit-app/status-bulk) feeds every row; a row with no application renders
   nothing extra, exactly as today. */
.ca-app-rowprog-wrap { position: relative; display: inline-block; margin-top: 4px; outline: none; }
.ca-app-rowprog { display: flex; align-items: center; gap: 6px; cursor: help; }
.ca-app-rowprog-bar { width: 60px; height: 5px; background: #eee; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.ca-app-rowprog-fill { height: 100%; background: #b86e00; border-radius: 3px; }
.ca-app-rowprog-text { font-size: 11px; font-weight: 600; color: #b86e00; white-space: nowrap; }
/* Done reads as done, not as a full bar that still looks like more work. */
.ca-app-rowprog-done { margin-top: 4px; font-size: 11px; font-weight: 600; color: #1f6321; }
/* Same amber-on-dark tip as .pill-warn, sized for a short list of named parties instead
   of one line. Reachable without a pointer: the wrap is tabindex="0" so Tab reveals it
   via :focus for keyboard use; on a touch row (no hover) tapping it opens the panel,
   whose own Credit Application section (Task 16) already names these same parties. */
.ca-app-rowprog-tip {
  position: absolute; bottom: calc(100% + 7px); left: 0; min-width: 200px; max-width: 260px;
  background: #8a5a00; color: #fff; padding: 8px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 500; line-height: 1.4; text-align: left; white-space: normal;
  opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; z-index: 30;
}
.ca-app-rowprog-tip-title { font-weight: 700; margin-bottom: 3px; }
.ca-app-rowprog-tip ul { margin: 4px 0 0; padding-left: 14px; }
.ca-app-rowprog-tip li { margin-bottom: 2px; }
.ca-app-rowprog-wrap:hover .ca-app-rowprog-tip,
.ca-app-rowprog-wrap:focus .ca-app-rowprog-tip,
.ca-app-rowprog-wrap:focus-within .ca-app-rowprog-tip { opacity: 1; visibility: visible; }
@media (max-width: 640px) {
  /* The wrap sits at the row's left inset, so left:0 (same anchor as desktop)
     never pushes the tip past the right edge -- flipping to right:0 here was
     the actual bug: it anchored the tip's right edge at the wrap instead,
     which drove the 200px min-width straight off the left side of the
     viewport. Keep the anchor, just stop forcing a width wider than the row
     has room for on either side. */
  .ca-app-rowprog-tip { min-width: 0; max-width: calc(100vw - 48px); }
}

/* CUSTEVENT1 — the attention bell (OperFi staff only). Blue, matching the "needs
   review" language this screen already uses for app-rcvd/boost, not the denied red
   or the billing amber -- both of those mean something else here. */
.chip.chip-bell { position: relative; border-color: #b8d4f0; background: #eaf3fc; color: #0d4a8a; }
.chip.chip-bell:hover { border-color: #8db8e0; }
.chip.chip-bell.active { background: #0d4a8a; color: #fff; border-color: #0d4a8a; }
.chip.chip-bell .count { background: rgba(13,74,138,0.12); color: #0d4a8a; }
.chip.chip-bell.active .count { background: rgba(255,255,255,0.2); color: #fff; }

/* The bell's hover/focus breakdown -- what Tom actually asked for: "if they hover over
   it it shows them where it's at." Same tip pattern as .ca-app-rowprog-tip (below):
   absolutely positioned, invisible until :hover/:focus/:focus-within, reachable by
   keyboard because the bell itself is tabindex="0". Anchored under the chip (not above
   it, like the row-progress tip) since the bell sits at the top of the toolbar with no
   room above it. */
.ca-attn-tip {
  position: absolute; top: calc(100% + 7px); left: 0; min-width: 180px; max-width: 280px;
  background: #0d4a8a; color: #fff; padding: 8px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; line-height: 1.4; text-align: left; white-space: normal;
  opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; z-index: 30;
}
.chip.chip-bell:hover .ca-attn-tip,
.chip.chip-bell:focus .ca-attn-tip,
.chip.chip-bell:focus-within .ca-attn-tip { opacity: 1; visibility: visible; }

/* The same breakdown text, as a static line under the chip row instead of a hover tip --
   the only way to reach it at 390px, where nothing is hovered. Shown only while the
   attention filter is active, so it stays visible for the length of the filtered work
   instead of disappearing the moment the pointer leaves the chip. */
.ca-attn-breakdown-line { font-size: 12px; font-weight: 600; color: #0d4a8a; margin: -4px 0 10px; }

/* The row marker: the reason a customer moved up is visible without opening it.
   A direct child of .row (not nested in the Customer cell) so it can span every
   column -- the row's own grid auto-placement drops it onto its own line below
   the columns since row 1 is already full. The gap the row grid already applies
   between rows is the only spacing it needs. */
.ca-attn-marker {
  grid-column: 1 / -1;
  display: flex; align-items: baseline; gap: 6px;
  font-size: 11px; font-weight: 600; color: #0d4a8a;
}
.ca-attn-marker .ca-attn-bell { flex-shrink: 0; }
.ca-attn-marker .ca-attn-summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ca-attn-marker .ca-attn-time { color: #888; font-weight: 500; flex-shrink: 0; }

/* The detail-pane list of unread events + Mark reviewed, reusing the .dec-row/.dec-msg
   shell the decision section already established. */
.ca-attn-events { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.ca-attn-event { background: #eaf3fc; border: 1px solid #b8d4f0; border-radius: 8px; padding: 10px 12px; }
.ca-attn-event-summary { font-size: 13px; font-weight: 600; color: #272727; }
.ca-attn-event-time { font-size: 11px; color: #888; margin-top: 2px; }

@media (max-width: 640px) {
  .ca-attn-marker { flex-wrap: wrap; }
  .ca-attn-marker .ca-attn-summary { white-space: normal; }
  /* Same off-screen fix as .ca-app-rowprog-tip above: left:0 anchored at the chip is
     fine, the fixed min-width was what pushed past the viewport edge on a narrow
     phone. Moot in practice since hover doesn't exist at 390px anyway -- the
     .ca-attn-breakdown-line is what's actually reachable there -- but keyboard focus
     still reveals this tip, so it must not run off-screen either. */
  .ca-attn-tip { min-width: 0; max-width: calc(100vw - 48px); }
}
</style>
</head>
<body>

<div class="widget">

  <div class="widget-header">
    <div>
      <div class="widget-title">Customer Approvals</div>
      <div class="widget-sub">Status of every customer you've submitted for credit review</div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-export"><span class="ic">⤓</span>Export CSV</button>
      <button class="btn primary" id="btn-new"><span class="ic">＋</span>New Credit Check</button>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Total Customers</div><div class="kpi-value" id="kpi-total">—</div></div>
    <div class="kpi approved"><div class="kpi-label">Approved</div><div class="kpi-value" id="kpi-approved">—</div></div>
    <div class="kpi awaiting"><div class="kpi-label">Awaiting Decision</div><div class="kpi-value" id="kpi-awaiting">—</div></div>
    <div class="kpi denied"><div class="kpi-label">Denied</div><div class="kpi-value" id="kpi-denied">—</div></div>
    <div class="kpi value"><div class="kpi-label">Total Credit Limit</div><div class="kpi-value" id="kpi-limit">—</div></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <span class="search-ic">⌕</span>
      <input type="text" id="search-input" placeholder="Search by company, email, or phone...">
    </div>
    <div class="chips" id="chips"></div>
    <select id="sort-select" class="btn" aria-label="Sort customers" style="cursor:pointer;">
      <option value="newest" selected>Newest</option>
      <option value="oldest">Oldest</option>
      <option value="name_asc">Name (A–Z)</option>
      <option value="name_desc">Name (Z–A)</option>
    </select>
  </div>

  <!-- CUSTEVENT1 — the type breakdown, surfaced a second way for when the bell's own
       hover/focus tip can't be reached (390px has no hover). Visible only while the
       attention filter is active, so it stays put while working the filtered list
       instead of vanishing when the pointer moves off the chip. -->
  <div class="ca-attn-breakdown-line" id="attn-breakdown-line" style="display:none;"></div>

  <div id="results">
    <div class="state">
      <div class="spinner"></div>
      <div class="state-title">Loading customer approvals…</div>
      <div class="state-msg" id="load-progress">Pulling your customer submissions</div>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none;">
    <div id="footer-count">—</div>
  </div>

  <div style="text-align:right;font-size:10px;color:#bbb;padding:10px 8px 0;">v2026-06-29.1</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>
<div class="toast" id="toast"></div>

<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script src="https://app.operfi.com/operfi-impersonate.js?v=2"></script>
<script src="https://app.operfi.com/pdfjs/pdf.min.js?v=2"></script>
<script src="https://app.operfi.com/operfi-docviewer.js?v=3"></script>
<script>
(function() {
'use strict';

// ── Config ────────────────────────────────────────────────────────────────
var BROKER_API_BASE = 'https://operfi-broker-api.onrender.com';

// ── State ─────────────────────────────────────────────────────────────────
var brokerEmail = '';
var allRecords = [];
Object.defineProperty(window, 'allRecords', { get: function(){ return allRecords; }, configurable: true });  // exposed for tests
var filteredRecords = [];
var allClients = false;       // true when backend returns see-all (admin/credit, not impersonating)
// get+set (unlike allRecords' read-only exposure above): fetchFraudCheck and
// fetchCreditAppRisk gate an OperFi-staff-only fetch on this closure variable
// directly (never window.allClients -- there is no production code path that
// sets it), so a test needs a way to flip the real value fetchAll would set
// from payload.all_clients without driving a full /broker-report round trip.
Object.defineProperty(window, 'allClients',
  { get: function(){ return allClients; }, set: function(v){ allClients = v; }, configurable: true });  // exposed for tests
var currentStatus = 'all';

// The owning broker is the dotted traversal field "Contact.Account_Name" (a lookup object),
// distinct from the debtor (Customer_Company_Name); fall back to a direct Account_Name.
function brokerName(rec){
  var a = rec && (rec['Contact.Account_Name'] || rec.Account_Name);
  if (a && typeof a === 'object') return a.zc_display_value || a.display_value || a.Account_Name || '';
  return a || '';
}
window.brokerName = brokerName;
window.renderFraudCheck = function(d){ return renderFraudCheck(d); };  // exposed for tests (CC2)
window.urlVal = function(v){ return urlVal(v); };                      // exposed for tests
window.wireBillingEdit = function(r){ return wireBillingEdit(r); };    // exposed for tests (CA1)
var currentSearch = '';
var currentSort = 'newest';
var openIndex = -1;
var currentLoadId = 0;

// CUSTEVENT1 — the attention bell's state. Staff only (see fetchCustomerEventsBulk's
// allClients gate); stays at its quiet defaults for every broker viewer.
var customerEventsTotal = 0;          // distinct customers with unread events
var customerEventsCounts = {};        // subject_id -> event count, straight from the payload
var customerEventsBySubject = {};     // subject_id -> [events], newest first (server order)
var attentionFilterActive = false;    // the bell chip's own on/off, independent of currentStatus
var customerEventsSeq = 0;            // guards against a stale bulk response overtaking a newer load

// ── Status mapping ────────────────────────────────────────────────────────
// Maps Credit_Decision → { key, label, pill }
var STATUS_MAP = {
  'Approved':                          { key: 'approved',    label: 'Approved',          pill: 'approved' },
  'Awaiting Credit Decision':          { key: 'awaiting',    label: 'Awaiting Decision', pill: 'awaiting' },
  'Pending Credit Application':        { key: 'pending-app', label: 'Pending Credit App', pill: 'pending-app' },
  'Credit App Sent - Awaiting Customer': { key: 'app-sent',  label: 'App Sent',          pill: 'app-sent' },
  "Credit App Rec'd - Pending Review": { key: 'app-rcvd',    label: "App Rec'd",          pill: 'app-rcvd' },
  'Credit Boost Requested':            { key: 'boost',       label: 'Boost Requested',   pill: 'boost' },
  'Denied':                            { key: 'denied',      label: 'Denied',            pill: 'denied' },
  'Expired':                           { key: 'expired',     label: 'Expired',           pill: 'expired' }
};
// ── BPOC1 — billing contact gate ────────────────────────────────────────────
// A credit-approved customer still cannot be invoiced without a billing contact, and
// /funding-submit refuses the load. The broker used to discover that at Submit Load,
// after building the whole thing. Warn here, where the fix already lives (CA1).
//
// Must mirror the backend's _billing_complete exactly: all three fields, whitespace
// does not count as filled.
var BILLING_FIELDS = ['Billing_Point_of_Contact', 'Billing_AP_Contact_Number', 'Billing_Email'];

function billingIncomplete(r) {
  r = r || {};
  return BILLING_FIELDS.some(function(f) { return !String(r[f] == null ? '' : r[f]).trim(); });
}

// Only customers that could actually carry a load today. Nagging about billing on one
// still awaiting a credit decision is noise -- it may never be approved -- and it buries
// the warnings that do matter.
function needsBillingWarning(r) {
  var k = statusMeta(r).key;
  return (k === 'approved' || k === 'boost') && billingIncomplete(r);
}

function billingAlertHtml(r) {
  if (!needsBillingWarning(r)) return '';
  return '<div class="ca-billing-alert" id="ca-billing-alert">' +
      '<div class="cba-body">' +
        '<div class="cba-title">⚠ Billing contact required before you can submit a load</div>' +
        '<div class="cba-msg">This customer is approved, but a billing point of contact ' +
          'name, phone, and email must be on file before a load can be submitted for funding.</div>' +
      '</div>' +
      '<button class="cba-fix" id="ca-billing-alert-fix" type="button">Add Billing Info</button>' +
    '</div>';
}

// BPOC2: the marker that rides the status pill. Same sentence as the row line -- the
// repetition is deliberate, this is the thing clients call about.
var BILLING_WARN_TEXT = 'Billing contact required to submit loads';

function pillWarnHtml(r) {
  if (!needsBillingWarning(r)) return '';
  return '<span class="pill-warn" role="img" aria-label="' + esc(BILLING_WARN_TEXT) + '">⚠' +
    '<span class="pill-tip">' + esc(BILLING_WARN_TEXT) + '</span></span>';
}

if (typeof window !== 'undefined') {
  window.billingIncomplete = billingIncomplete;
  window.needsBillingWarning = needsBillingWarning;
  window.billingAlertHtml = billingAlertHtml;
  window.pillWarnHtml = pillWarnHtml;
}

// CRSTAT1: a BLANK Credit_Decision means nobody has decided yet, so it reads as
// Awaiting Decision. Creator's form-level initial value only fires when a human opens
// the form, and the form hides Credit_Decision on load, so every submission created
// through the portal API landed blank. Blank was not a recognised status, so those
// records dropped out of the Awaiting chip AND the Awaiting Decision KPI -- the credit
// team's queue undercounted by a couple hundred submissions with nothing to show for it.
//
// The backend now stamps the field on create; this is the safety net for anything that
// still slips through. A blank is the ONLY value assumed -- an unrecognised non-blank
// value stays 'unknown' on purpose, so the next breakage is visible instead of masked.
function statusMeta(rec) {
  var raw = (rec && rec.Credit_Decision) || '';
  if (STATUS_MAP[raw]) return STATUS_MAP[raw];
  if (!String(raw).trim()) return STATUS_MAP['Awaiting Credit Decision'];
  return { key: 'unknown', label: raw, pill: '' };
}

// The value the admin decision dropdown should open on. DECISION_VALUES[0] is 'Approved',
// so a blank record with no option marked selected would leave the browser showing
// "Approved" in the box on an untouched submission. Blank opens on Awaiting instead.
function decisionSelectValue(rec) {
  var raw = String((rec && rec.Credit_Decision) || '').trim();
  return raw || 'Awaiting Credit Decision';
}

if (typeof window !== 'undefined') {
  window.statusMeta = statusMeta;                    // exposed for tests (CRSTAT1)
  window.decisionSelectValue = decisionSelectValue;
}

// ── Credit decision write (see-all / role context only) ─────────────────────
// The 8 settable Credit_Decision values (mirrors the backend CREDIT_DECISION_VALUES set).
var DECISION_VALUES = ['Approved','Awaiting Credit Decision','Pending Credit Application',
  'Credit App Sent - Awaiting Customer',"Credit App Rec'd - Pending Review",
  'Credit Boost Requested','Denied','Expired'];
window.DECISION_VALUES = DECISION_VALUES;

// Posts a decision. Returns {ok:true,...} or {ok:false,error}. Mirrors the server's
// "Approved requires a positive limit" guard for instant feedback. Reads window.brokerEmail
// so tests can drive it; falls back to the closure value in production.
function submitDecision(rec, vals){
  if (vals.decision === 'Approved' && (!vals.credit_limit || Number(vals.credit_limit) <= 0)) {
    return Promise.resolve({ ok: false, error: 'Credit limit required for Approved' });
  }
  var email = (typeof window !== 'undefined' && window.brokerEmail) || brokerEmail;
  return fetch(BROKER_API_BASE + '/credit-decision', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, submission_id: rec.ID,
      decision: vals.decision, credit_limit: vals.credit_limit, credit_notes: vals.credit_notes })
  }).then(function(r){ return r.json(); });
}
window.submitDecision = submitDecision;

// ── Boot ──────────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  bindGlobalUI();
  bootApp();
});

function bootApp() {
  if (typeof ZOHO === 'undefined' || !ZOHO.CREATOR) {
    showError('SDK unavailable', 'The Zoho Creator widget SDK did not load. Reload the page.');
    return;
  }

  function gotParams(params) {
    console.log('[CustomerApprovals] init params:', params);
    brokerEmail = (params && (params.loginUser || params.login_user || params.email)) || '';
    if (!brokerEmail) {
      showError('Could not identify broker',
        'No login email returned from Creator. Open DevTools console (F12) — the init params object is logged there.');
      return;
    }
    console.log('[CustomerApprovals] Booted as', brokerEmail);
    loadAllRecords();
  }

  if (!ZOHO.CREATOR.UTIL || typeof ZOHO.CREATOR.UTIL.getInitParams !== 'function') {
    console.error('[CustomerApprovals] getInitParams not available. ZOHO.CREATOR keys:', Object.keys(ZOHO.CREATOR || {}));
    showError('SDK shape unexpected', 'getInitParams is not available on this SDK build. Open DevTools console (F12).');
    return;
  }

  try {
    var result = ZOHO.CREATOR.UTIL.getInitParams();
    if (result && typeof result.then === 'function') {
      result.then(gotParams).catch(function(err) {
        console.error('[CustomerApprovals] getInitParams rejected', err);
        showError('Initialization failed', 'Could not read init params. Open DevTools console (F12).');
      });
    } else {
      gotParams(result);
    }
  } catch (err) {
    console.error('[CustomerApprovals] getInitParams threw', err);
    showError('Initialization failed', 'Could not read init params. Open DevTools console (F12).');
  }
}

function bindGlobalUI() {
  document.getElementById('search-input').addEventListener('input', function(e) {
    currentSearch = e.target.value.toLowerCase().trim();
    applyFilters();
  });
  document.getElementById('sort-select').addEventListener('change', function(e) {
    currentSort = e.target.value;
    applyFilters();
  });
  document.getElementById('btn-new').addEventListener('click', function() { navigateParent('#Page:Credit_Check'); });
  document.getElementById('btn-export').addEventListener('click', exportCsv);

  // Panel close + keyboard
  document.getElementById('scrim').addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('panel').classList.contains('show')) return;
    if (e.key === 'Escape') closePanel();
    else if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); navPanel(1); }
    else if (e.key === 'ArrowUp'   || e.key === 'k') { e.preventDefault(); navPanel(-1); }
  });
}

// Cross-origin portal navigation. ZOHO.CREATOR.UTIL.navigateParentURL throws
// "Improper Configuration" in the v2.0 widget SDK, so we set window.top.location directly.
function navigateParent(hash) {
  var sp = new URLSearchParams(window.location.search);
  var origin = sp.get('serviceOrigin') || 'https://brokerhub.operfi.com';
  var url = origin.replace(/\/$/, '') + '/' + hash;
  try { window.top.location.href = url; return; } catch (e) {}
  try { window.parent.location.href = url; return; } catch (e) {}
  try { window.open(url, '_top'); } catch (e) {}
}

// ── Data load ─────────────────────────────────────────────────────────────
var loadStart = 0;
var loadSafetyTimer = null;

function loadAllRecords() {
  if (!brokerEmail) return;

  currentLoadId++;
  var loadId = currentLoadId;

  document.getElementById('results').innerHTML =
    '<div class="state"><div class="spinner"></div>' +
    '<div class="state-title">Loading customer approvals…</div>' +
    '<div class="state-msg" id="load-progress">Pulling your customer submissions</div></div>';

  loadStart = Date.now();
  clearTimeout(loadSafetyTimer);
  loadSafetyTimer = setTimeout(function() {
    if (loadId !== currentLoadId) return;
    showError('Loading is taking longer than expected', 'Open DevTools console (F12) for details.');
  }, 60000);

  fetchAll(loadId);
}

function setProgress(msg) {
  var el = document.getElementById('load-progress');
  if (el) el.textContent = msg;
}

function fetchAll(loadId) {
  setProgress('Fetching from server…');
  var pageStart = Date.now();
  var qs = new URLSearchParams({
    email: brokerEmail,
    report: 'Customer_Submission_Report',
    from_idx: '1',
    limit: '200'
  });
  var url = BROKER_API_BASE + '/broker-report?' + qs.toString();

  fetch(url).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(body) { throw new Error('HTTP ' + res.status + ' ' + body); });
    }
    return res.json();
  }).then(function(payload) {
    if (loadId !== currentLoadId) return;
    clearTimeout(loadSafetyTimer);
    allClients = !!(payload && payload.all_clients);
    var data = payload.records || [];
    console.log('[CustomerApprovals] Got', data.length, 'records in', (Date.now() - pageStart) + 'ms');
    onRecordsLoaded(data);
  }).catch(function(err) {
    if (loadId !== currentLoadId) return;
    clearTimeout(loadSafetyTimer);
    console.error('[CustomerApprovals] /broker-report failed', err);
    showError('Could not load customer approvals', 'Open DevTools console (F12) for the error.');
  });
}

function onRecordsLoaded(records) {
  allRecords = records;
  buildChips();
  applyFilters();
  fetchCreditAppStatusBulk();   // one call for the whole list, see CREDITAPP1 Task 17 below
  fetchCustomerEventsBulk();    // one call for the whole list, see CUSTEVENT1 below
}
window.onRecordsLoaded = onRecordsLoaded;  // exposed for tests (SORT2)

// ── Filters & rendering ───────────────────────────────────────────────────
function buildChips() {
  var chips = document.getElementById('chips');
  var counts = countByStatus(allRecords);
  var awaitingCount = (counts['awaiting'] || 0) + (counts['pending-app'] || 0);
  var def = [
    { key: 'all',        label: 'All',          count: allRecords.length },
    { key: 'approved',   label: 'Approved',     count: counts['approved'] || 0 },
    { key: 'awaiting',   label: 'Awaiting',     count: awaitingCount },
    { key: 'app-sent',   label: 'App Sent',     count: counts['app-sent'] || 0 },
    { key: 'app-rcvd',   label: "App Rec'd",     count: counts['app-rcvd'] || 0 },
    { key: 'boost',      label: 'Boost Pending', count: counts['boost'] || 0 },
    { key: 'denied',     label: 'Denied',       count: counts['denied'] || 0 },
    { key: 'expired',    label: 'Expired',      count: counts['expired'] || 0 }
  ];
  chips.innerHTML = '';

  // CUSTEVENT1 — the attention bell. Quiet when there is nothing: it renders nothing
  // at all (not merely hidden) with no unread events, so the toolbar looks exactly as
  // it does today for a non-staff viewer or a staff viewer with an empty queue.
  if (allClients && customerEventsTotal > 0) {
    var bell = document.createElement('span');
    bell.className = 'chip chip-bell' + (attentionFilterActive ? ' active' : '');
    bell.id = 'attn-bell';
    bell.title = 'Customers with unread activity since you last cleared them';
    // CUSTEVENT1 type breakdown -- what KIND of unread activity is waiting, not just
    // how many customers. Reachable by keyboard (tabindex + :focus/:focus-within in
    // the CSS above), not just by mouse hover.
    bell.tabIndex = 0;
    bell.setAttribute('role', 'button');
    bell.setAttribute('aria-pressed', attentionFilterActive ? 'true' : 'false');
    var bellBreakdown = customerEventsBreakdownText();
    if (bellBreakdown) bell.setAttribute('aria-label', 'Needs Attention. ' + bellBreakdown);
    bell.innerHTML = '🔔 Needs Attention <span class="count">' + customerEventsTotal + '</span>' +
      (bellBreakdown ? '<span class="ca-attn-tip">' + esc(bellBreakdown) + '</span>' : '');
    bell.addEventListener('click', function() {
      attentionFilterActive = !attentionFilterActive;
      buildChips();
      applyFilters();
    });
    chips.appendChild(bell);
  }

  def.forEach(function(c) {
    if (c.key === 'expired' && c.count === 0) return;  // hide rare chip when empty
    var el = document.createElement('span');
    el.className = 'chip' + (c.key === currentStatus ? ' active' : '');
    el.dataset.key = c.key;
    el.innerHTML = esc(c.label) + ' <span class="count">' + c.count + '</span>';
    el.addEventListener('click', function() {
      currentStatus = c.key;
      document.querySelectorAll('#chips .chip').forEach(function(x) { x.classList.remove('active'); });
      el.classList.add('active');
      applyFilters();
    });
    chips.appendChild(el);
  });

  // CUSTEVENT1 — the same breakdown as the bell's hover tip, but as a line that stays
  // put while the attention filter is active (the case the tip can't cover at 390px,
  // where nothing is hovered). Only shown while the filter is on; gone the moment it
  // isn't, same as the tip only appearing on hover/focus.
  var breakdownLine = document.getElementById('attn-breakdown-line');
  if (breakdownLine) {
    var lineText = (attentionFilterActive && customerEventsTotal > 0) ? customerEventsBreakdownText() : '';
    breakdownLine.textContent = lineText;
    breakdownLine.style.display = lineText ? '' : 'none';
  }
}

function countByStatus(records) {
  var c = {};
  records.forEach(function(r) {
    var k = statusMeta(r).key;
    c[k] = (c[k] || 0) + 1;
  });
  return c;
}

function applyFilters() {
  filteredRecords = sortRecords(allRecords).filter(function(r) {
    // CUSTEVENT1 — the bell as a filter. Lifts a customer with unread activity above
    // twenty newer, unchanged ones, independent of the status chip in effect.
    if (attentionFilterActive && !hasUnreadEvents(r)) return false;
    if (currentStatus !== 'all') {
      var k = statusMeta(r).key;
      // "Awaiting" chip groups awaiting + pending-app
      if (currentStatus === 'awaiting') {
        if (k !== 'awaiting' && k !== 'pending-app') return false;
      } else if (k !== currentStatus) {
        return false;
      }
    }
    if (currentSearch) {
      var hay = [
        r.Customer_Company_Name,
        r.Email,
        r.Customer_Point_of_Contact,
        r.Billing_Point_of_Contact,
        r.Phone_Number,
        r.Phone_Number1
      ].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(currentSearch) === -1) return false;
    }
    return true;
  });
  renderKpis();
  renderList();
  renderFooter();
}

function renderKpis() {
  var counts = countByStatus(allRecords);
  var awaitingCount = (counts['awaiting'] || 0) + (counts['pending-app'] || 0) + (counts['app-sent'] || 0) + (counts['app-rcvd'] || 0);
  var totalLimit = allRecords.reduce(function(sum, r) {
    return sum + (statusMeta(r).key === 'approved' || statusMeta(r).key === 'boost' ? parseMoney(r.Credit_Limit) : 0);
  }, 0);

  document.getElementById('kpi-total').textContent = allRecords.length.toLocaleString();
  document.getElementById('kpi-approved').textContent = (counts['approved'] || 0).toLocaleString();
  document.getElementById('kpi-awaiting').textContent = awaitingCount.toLocaleString();
  document.getElementById('kpi-denied').textContent = (counts['denied'] || 0).toLocaleString();
  document.getElementById('kpi-limit').innerHTML = '$' + Math.floor(totalLimit).toLocaleString() +
    '<span class="small">.' + String(Math.round((totalLimit % 1) * 100)).padStart(2, '0') + '</span>';
}

function renderList() {
  var results = document.getElementById('results');
  if (!filteredRecords.length) {
    results.innerHTML = '<div class="state"><div class="state-title">No customers match your filters</div>' +
      '<div class="state-msg">Try changing the status filter or search term.</div></div>';
    return;
  }

  var html = '<div class="list">';
  filteredRecords.forEach(function(r) {
    html += rowHtml(r, allRecords.indexOf(r));
  });
  html += '</div>';
  results.innerHTML = html;

  results.querySelectorAll('.row').forEach(function(rowEl) {
    rowEl.addEventListener('click', function(e) {
      // Don't open panel when clicking on a row action button
      if (e.target.closest('.row-action')) return;
      var idx = parseInt(rowEl.dataset.idx, 10);
      openPanel(idx);
    });
  });

  // Bind row action buttons
  results.querySelectorAll('.row-action[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var action = btn.dataset.action;
      var recId = btn.dataset.recid;
      if (action === 'boost') openCreditBoost(recId);
      else if (action === 'resubmit') navigateParent('#Page:Credit_Check');
      else if (action === 'send-credit-app') openSendCreditApp(btn.dataset.recid, btn.dataset.email || '', btn.dataset.site || '');
    });
  });
}

function rowHtml(r, idx) {
  var s = statusMeta(r);
  var limit = parseMoney(r.Credit_Limit);
  var hasLimit = (s.key === 'approved' || s.key === 'boost') && limit > 0;
  var limitColor = s.key === 'approved' ? '#1f6321' : (s.key === 'boost' ? '#0d4a8a' : '#999');
  var poc = r.Customer_Point_of_Contact || '—';
  var email = r.Email || '';
  var phone = r.Phone_Number1 || r.Phone_Number || '';
  var addr = formatAddress(r);
  var submittedAt = parseDate(r.Added_Time);
  var decidedAt = parseDate(r.Credit_Decision_Date);
  var dateLine = '';
  if (decidedAt && (s.key === 'approved' || s.key === 'denied' || s.key === 'expired' || s.key === 'boost')) {
    var verb = s.key === 'denied' ? 'Denied' : (s.key === 'expired' ? 'Expired' : (s.key === 'boost' ? 'Boost decision' : 'Approved'));
    dateLine = verb + ' ' + fmtRelative(decidedAt);
  } else if (submittedAt) {
    dateLine = 'Submitted ' + fmtRelative(submittedAt);
  }

  var recId = r.ID || '';
  var actionCell = '';
  if (s.key === 'approved') {
    actionCell = '<button class="row-action" data-action="boost" data-recid="' + esc(recId) + '">Request Credit Boost</button>';
  } else if (s.key === 'denied') {
    actionCell = '<button class="row-action" data-action="resubmit">Resubmit</button>';
  } else if (s.key === 'boost') {
    actionCell = '<span class="row-action-placeholder">Boost under review</span>';
  } else if (s.key === 'app-sent') {
    actionCell = '<span class="row-action-placeholder">Pending customer reply</span>';
  } else if (s.key === 'app-rcvd') {
    actionCell = '<span class="row-action-placeholder">In credit review</span>';
  } else if (s.key === 'awaiting' || s.key === 'pending-app') {
    actionCell = '<span class="row-action-placeholder">Awaiting OperFi review</span>';
  } else if (s.key === 'expired') {
    actionCell = '<button class="row-action" data-action="resubmit">Resubmit</button>';
  }

  if (['pending-app','awaiting','approved','app-sent','denied'].indexOf(s.key) !== -1) {
    var sendLabel = (s.key === 'app-sent') ? 'Resend Credit App' : 'Send Credit Application';
    var emailAttr = esc(r.Email || '');
    var siteAttr = esc((r.Company_Website && (r.Company_Website.value || r.Company_Website.url)) || r.Company_Website || '');
    actionCell += '<button class="row-action" data-action="send-credit-app" data-recid="' + esc(recId) +
                  '" data-email="' + emailAttr + '" data-site="' + siteAttr + '">' + sendLabel + '</button>';
  }

  // See-all (admin/credit) prepends a Client column; widen the row grid by one column.
  var rowStyle = allClients ? ' style="grid-template-columns:1.3fr 1.6fr 1.4fr 0.9fr 1.1fr 1.1fr 28px;"' : '';
  var clientCell = allClients
    ? '<div>' +
        '<div class="cell-label">Client</div>' +
        '<div class="cell-val">' + esc(brokerName(r) || '—') + '</div>' +
      '</div>'
    : '';

  return '' +
    '<div class="row s-' + s.key + '"' + rowStyle + ' data-idx="' + idx + '">' +
      clientCell +
      '<div>' +
        '<div class="cell-label">Customer</div>' +
        '<div class="cell-val lg">' + esc(r.Customer_Company_Name || '—') + '</div>' +
        (addr ? '<div class="cell-sub">' + esc(addr) + '</div>' : '') +
        (dateLine ? '<div class="cell-sub" style="color:#aaa;">' + esc(dateLine) + '</div>' : '') +
        // BPOC1: the approved customer that cannot actually carry a load yet.
        (needsBillingWarning(r)
          ? '<div class="billing-warn">⚠ Billing contact required to submit loads</div>' : '') +
        caAppRowProgressHtml(r) +
      '</div>' +
      '<div>' +
        '<div class="cell-label">Contact</div>' +
        '<div class="cell-val">' + esc(email || poc) + '</div>' +
        (phone ? '<div class="cell-sub">' + esc(formatPhone(phone)) + '</div>' : '') +
      '</div>' +
      '<div>' +
        '<div class="cell-label">Credit Limit</div>' +
        (hasLimit
          ? '<div class="cell-val lg" style="color:' + limitColor + ';">' + esc(formatMoneyShort(limit)) + '</div>'
          : '<div class="cell-val" style="color:#999;">' + (s.key === 'app-rcvd' ? 'Pending review' : '—') + '</div>') +
      '</div>' +
      '<div class="pill-cell"><span class="status-pill ' + s.pill + '">' + esc(s.label) + '</span>' + pillWarnHtml(r) + '</div>' +
      '<div>' + actionCell + '</div>' +
      '<div class="chev cell-chev">›</div>' +
      // Full-width, beneath the columns: a direct grid child (not nested in the
      // Customer cell) so grid-column:1/-1 can give it the whole row instead of
      // being squeezed into the narrow Customer track.
      customerEventRowMarkerHtml(r) +
    '</div>';
}

function renderFooter() {
  var f = document.getElementById('footer');
  if (!filteredRecords.length) { f.style.display = 'none'; return; }
  f.style.display = 'flex';
  document.getElementById('footer-count').textContent =
    'Showing ' + filteredRecords.length + ' of ' + allRecords.length + ' customers';

function showError(title, msg) {
  document.getElementById('results').innerHTML =
    '<div class="state"><div class="state-title">' + esc(title) + '</div><div class="state-msg">' + esc(msg) + '</div></div>';
}

// ── Panel ─────────────────────────────────────────────────────────────────
function openPanel(allRecordsIdx) {
  var rec = allRecords[allRecordsIdx];
  var idx = filteredRecords.indexOf(rec);
  if (idx === -1) return;
  openIndex = idx;
  renderPanel();
  document.getElementById('scrim').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
function closePanel() {
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
  openIndex = -1;
}
function navPanel(dir) {
  var next = openIndex + dir;
  if (next < 0 || next >= filteredRecords.length) return;
  openIndex = next;
  renderPanel();
}

function renderPanel() {
  var r = filteredRecords[openIndex];
  if (!r) return;
  var s = statusMeta(r);
  var limit = parseMoney(r.Credit_Limit);

  if (s.key === 'approved') {
    footerActionsHtml = '<button class="btn primary" id="p-boost">Request Credit Boost</button>';

    footerActionsHtml = '<button class="btn primary" id="p-resubmit">Resubmit</button>';

  // Decision section — see-all / role context only (backend enforces the role regardless).

  var decisionSectionHtml = '';
  if (allClients) {

          '<label class="dec-label" for="dec-notes">Notes</label>' +

    attnSectionHtml = '' +
      '<div class="panel-section" id="ca-attn-section" style="display:none;">' +
        '<div class="panel-section-title">Needs Attention</div>' +
        '<div class="ca-attn-events" id="ca-attn-events"></div>' +
        '<div class="dec-row" id="ca-attn-row" style="display:none;">' +

      '</div>' +

      // CUSTEVENT1 — first thing a reviewer sees: the reason this customer got pulled
